<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ハートフラッピー 💕</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kurenaido&family=Cormorant+Garamond:ital@1&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #1a0a14;
  --pink: #f472b6;
  --pink-l: #fba8d0;
  --gold: #d4a84c;
  --gold-l: #f0cc78;
  --cream: #fdf0f5;
  --text: #fce7f3;
  --dim: rgba(252,231,243,0.45);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);}
body{font-family:'Zen Kurenaido',cursive;display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:none;}

/* ===== CANVAS WRAPPER ===== */
#game-wrap{
  position:relative;
  display:flex;flex-direction:column;align-items:center;
  width:100%;height:100%;
  max-width:480px;
}

/* トップバー */
#top-bar{
  position:absolute;top:0;left:0;right:0;
  display:flex;justify-content:space-between;align-items:center;
  padding:12px 16px;z-index:20;
}
#back-btn{
  background:rgba(244,114,182,0.12);border:1px solid rgba(244,114,182,0.3);
  border-radius:999px;color:var(--pink-l);padding:7px 16px;
  font-family:'Zen Kurenaido',cursive;font-size:13px;letter-spacing:1px;
  cursor:pointer;text-decoration:none;transition:background 0.2s;
}
#back-btn:hover{background:rgba(244,114,182,0.22);}
#score-display{
  font-size:13px;color:var(--gold-l);letter-spacing:2px;
  text-shadow:0 0 12px rgba(212,168,76,0.5);
}

/* ゲームキャンバス */
#game-canvas{
  position:absolute;inset:0;width:100%;height:100%;
  display:block;
}

/* ===== OVERLAYS ===== */
.overlay{
  position:absolute;inset:0;z-index:30;
  background:rgba(10,2,8,0.88);backdrop-filter:blur(10px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:32px 24px;text-align:center;
  animation:fadeIn 0.4s ease;
}
.overlay.hidden{display:none;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}

.ov-icon{font-size:64px;margin-bottom:16px;animation:heartbeat 1.4s ease-in-out infinite;}
@keyframes heartbeat{0%,100%{transform:scale(1);}50%{transform:scale(1.2);}}
.ov-title{font-size:clamp(24px,5vw,36px);color:var(--cream);margin-bottom:8px;text-shadow:0 0 24px rgba(244,114,182,0.5);}
.ov-sub{font-size:13px;color:var(--dim);letter-spacing:2px;margin-bottom:28px;line-height:1.8;}
.ov-score{font-size:14px;color:var(--gold-l);letter-spacing:2px;margin-bottom:4px;}
.ov-best{font-size:12px;color:var(--dim);letter-spacing:1px;margin-bottom:28px;}

/* ゴール達成メッセージ */
#goal-msg{
  background:linear-gradient(135deg,rgba(212,168,76,0.15),rgba(244,114,182,0.1));
  border:1px solid rgba(212,168,76,0.35);border-radius:12px;
  padding:14px 20px;margin-bottom:20px;
  font-size:13px;color:var(--gold-l);letter-spacing:1px;line-height:1.8;
  display:none;
}

.play-btn{
  background:linear-gradient(135deg,#e879a0,#f9a8d4,#e879a0);
  color:white;border:none;border-radius:999px;
  padding:16px 52px;font-family:'Zen Kurenaido',cursive;
  font-size:17px;letter-spacing:3px;cursor:pointer;
  box-shadow:0 4px 24px rgba(232,121,160,0.5);
  transition:transform 0.15s,box-shadow 0.15s;
  position:relative;overflow:hidden;
}
.play-btn::after{content:'';position:absolute;top:-60%;left:-60%;width:220%;height:220%;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,0.4) 50%,transparent 65%);animation:shine 3s linear infinite;}
@keyframes shine{from{transform:translateX(-100%) rotate(20deg);}to{transform:translateX(100%) rotate(20deg);}}
.play-btn:hover{transform:translateY(-3px);box-shadow:0 10px 36px rgba(232,121,160,0.7);}

.goal-hint{font-size:11px;color:var(--dim);margin-top:14px;letter-spacing:1px;line-height:1.8;}

/* CONFETTI */
.confetti-piece{position:fixed;top:-14px;pointer-events:none;z-index:999;animation:confettiFall linear forwards;}
@keyframes confettiFall{0%{transform:translateY(0) rotate(0deg);opacity:1;}80%{opacity:1;}100%{transform:translateY(108vh) rotate(900deg);opacity:0;}}

/* BACK TO TOP */
.back-to-top-btn{
  margin-top:18px;font-size:13px;color:var(--dim);letter-spacing:1px;
  text-decoration:none;border:1px solid rgba(244,114,182,0.22);
  border-radius:999px;padding:9px 26px;transition:background 0.2s,color 0.2s;
  display:inline-block;background:none;cursor:pointer;
  font-family:'Zen Kurenaido',cursive;
}
.back-to-top-btn:hover{background:rgba(244,114,182,0.1);color:var(--pink-l);}

/* DEBUG HINT */
#debug-hint{
  margin-top:14px;font-size:10px;color:rgba(252,231,243,0.18);
  letter-spacing:2px;min-height:16px;transition:color 0.3s;
}
#debug-hint.active{color:rgba(212,168,76,0.7);}

/* ENDLESS BUTTON */
.endless-btn{
  margin-top:12px;
  background:linear-gradient(135deg,#7c3aed,#a78bfa,#7c3aed) !important;
  box-shadow:0 4px 24px rgba(124,58,237,0.5) !important;
  font-size:15px !important;padding:14px 44px !important;
  -webkit-tap-highlight-color:transparent;
}
.endless-btn:hover{box-shadow:0 10px 36px rgba(124,58,237,0.7) !important;}
.endless-btn.hidden{display:none;}
@keyframes endlessUnlock{
  from{opacity:0;transform:translateY(18px) scale(0.82);}
  to{opacity:1;transform:translateY(0) scale(1);}
}
.endless-btn.unlocking{animation:endlessUnlock 0.7s cubic-bezier(0.22,1,0.36,1) forwards;}
@keyframes unlockMsg{
  0%{opacity:0;transform:translate(-50%,-50%) scale(0.4);}
  25%{opacity:1;transform:translate(-50%,-50%) scale(1.1);}
  60%{opacity:1;transform:translate(-50%,-50%) scale(1);}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1.25);}
}
/* CLEAR OVERLAY present btn */
#cl-present-btn{margin-bottom:12px;}
#cl-present-btn:disabled{background:rgba(255,255,255,0.1);color:var(--dim);box-shadow:none;cursor:default;}
#cl-present-btn:disabled::after{display:none;}

/* PRESENT BOX */
@keyframes hintPulse{0%,100%{opacity:0.4;transform:translateY(0);}50%{opacity:1;transform:translateY(-4px);}}
@keyframes heartbeat{0%,100%{transform:scale(1);}50%{transform:scale(1.25);}}
@keyframes boxShake{0%,100%{transform:rotate(0);}20%{transform:rotate(-8deg) scale(1.05);}40%{transform:rotate(8deg) scale(1.08);}60%{transform:rotate(-5deg);}80%{transform:rotate(4deg);}}
@keyframes boxBurst{0%{transform:scale(1);opacity:1;}30%{transform:scale(1.4) rotate(-10deg);opacity:1;}60%{transform:scale(1.6) rotate(15deg);opacity:0.5;}100%{transform:scale(0) rotate(30deg);opacity:0;}}
@keyframes revealIn{from{opacity:0;transform:scale(0.7) translateY(30px);}to{opacity:1;transform:scale(1) translateY(0);}}
@keyframes ringPulse{0%{transform:scale(0.5);opacity:0.8;}100%{transform:scale(2.5);opacity:0;}}
.tap-ring{position:absolute;inset:-10px;border-radius:50%;border:2px solid rgba(212,168,76,0.4);animation:ringPulse 1.8s ease-out infinite;pointer-events:none;}
.tap-ring:nth-child(2){animation-delay:0.6s;}
.tap-ring:nth-child(3){animation-delay:1.2s;}
.box-shaking{animation:boxShake 0.5s ease-in-out;}
.box-bursting{animation:boxBurst 0.55s cubic-bezier(0.36,0.07,0.19,0.97) forwards;}
#present-phase-reveal.show{animation:revealIn 0.8s cubic-bezier(0.22,1,0.36,1) forwards;}
</style>
</head>
<body>
<div id="game-wrap">
  <div id="top-bar">
    <a id="back-btn" href="index.html">← もどる</a>
    <div id="score-display">⭐ 0 / 50</div>
  </div>

  <canvas id="game-canvas"></canvas>

  <!-- START OVERLAY -->
  <div class="overlay" id="overlay-start">
    <div class="ov-icon">💕</div>
    <div class="ov-title">ハートフラッピー</div>
    <div class="ov-sub">タップ or スペースキーで<br>ハートをはばたかせて 🎀<br>リボンの障害物をよけてね！</div>
    <div class="goal-hint">🏆 ゴール：50個の障害物を超えたら<br>スペシャルプレゼントが出現！</div>
    <br>
    <button class="play-btn" id="btn-start">はじめる 💕</button>
    <button class="play-btn endless-btn hidden" id="endless-btn">♾️ エンドレスモード</button>
    <a href="index.html" class="back-to-top-btn" style="margin-top:16px;">← トップにもどる</a>
  </div>

  <!-- CLEAR OVERLAY -->
  <div class="overlay hidden" id="overlay-clear">
    <div class="ov-icon">🎉</div>
    <div class="ov-title">ゴールクリア！</div>
    <div class="ov-score" id="cl-score">スコア：0</div>
    <div class="ov-best" id="cl-best">ベスト：0</div>
    <button class="play-btn" id="cl-present-btn">🎁 プレゼントを受け取る</button>
    <button class="play-btn" id="btn-retry-clear" style="font-size:15px;padding:14px 44px;">もう一度 💕</button>
    <button class="back-to-top-btn" id="cl-start-btn" style="margin-top:14px;">スタートに戻る</button>
  </div>

  <!-- GAMEOVER OVERLAY -->
  <div class="overlay hidden" id="overlay-gameover">
    <div class="ov-icon">💔</div>
    <div class="ov-title">ゲームオーバー</div>
    <div class="ov-score" id="go-score">スコア：0</div>
    <div class="ov-best" id="go-best">ベスト：0</div>
    <div id="goal-msg" style="display:none;">🎁 ゴール達成！プレゼントを見てね！</div>
    <button class="play-btn" id="btn-retry">もう一度 💕</button>
    <div class="goal-hint" id="go-hint">あと<span id="go-remain">50</span>個で<br>プレゼントが出るよ！</div>
    <button class="back-to-top-btn" id="go-start-btn" style="margin-top:10px;">スタートに戻る</button>
    <a href="index.html" class="back-to-top-btn">← トップにもどる</a>
    <div id="debug-hint"></div>
  </div>

  <!-- CLEAR → プレゼントボックス演出 -->
  <div id="present-overlay" style="display:none;position:absolute;inset:0;z-index:50;background:rgba(8,1,10,0.97);align-items:center;justify-content:center;padding:24px;overflow:hidden;">
    <canvas id="present-bg-canvas" style="position:absolute;inset:0;pointer-events:none;"></canvas>
    <div id="present-inner" style="position:relative;z-index:1;text-align:center;max-width:360px;width:100%;display:flex;flex-direction:column;align-items:center;">

      <!-- PHASE 1: ボックス -->
      <div id="present-phase-box" style="display:flex;flex-direction:column;align-items:center;gap:16px;">
        <div id="present-hint" style="font-family:'Zen Kurenaido',cursive;font-size:14px;color:#fba8d0;letter-spacing:2px;animation:hintPulse 1.5s ease-in-out infinite;">タップして開けてね 🎀</div>
        <div id="present-box-wrap" style="cursor:pointer;position:relative;padding:20px;">
          <div class="tap-ring"></div><div class="tap-ring"></div><div class="tap-ring"></div>
          <svg id="present-box-svg" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg" style="width:180px;height:180px;filter:drop-shadow(0 0 32px rgba(212,168,76,0.7)) drop-shadow(0 0 60px rgba(244,114,182,0.4));">
            <defs>
              <linearGradient id="pb-body" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f9a8d4"/><stop offset="100%" stop-color="#e879a0"/></linearGradient>
              <linearGradient id="pb-lid"  x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fce7f3"/><stop offset="100%" stop-color="#fba8d0"/></linearGradient>
              <linearGradient id="pb-ribbon" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#f0cc78"/><stop offset="100%" stop-color="#d4a84c"/></linearGradient>
            </defs>
            <ellipse cx="80" cy="150" rx="52" ry="7" fill="rgba(0,0,0,0.25)"/>
            <rect x="20" y="74" width="120" height="76" rx="6" fill="url(#pb-body)"/>
            <rect x="14" y="58" width="132" height="24" rx="6" fill="url(#pb-lid)"/>
            <rect x="72" y="74" width="16" height="76" fill="url(#pb-ribbon)" opacity="0.85"/>
            <rect x="14" y="64" width="132" height="12" fill="url(#pb-ribbon)" opacity="0.85"/>
            <ellipse cx="64" cy="58" rx="24" ry="13" fill="url(#pb-ribbon)" transform="rotate(-30 64 58)" opacity="0.9"/>
            <ellipse cx="96" cy="58" rx="24" ry="13" fill="url(#pb-ribbon)" transform="rotate(30 96 58)" opacity="0.9"/>
            <circle cx="80" cy="58" r="10" fill="#f0cc78"/>
            <circle cx="80" cy="58" r="5.5" fill="#d4a84c"/>
            <ellipse cx="40" cy="64" rx="11" ry="4.5" fill="white" opacity="0.22" transform="rotate(-15 40 64)"/>
          </svg>
        </div>
      </div>

      <!-- PHASE 2: 内容 -->
      <div id="present-phase-reveal" style="display:none;flex-direction:column;align-items:center;gap:16px;overflow-y:auto;max-height:90vh;padding:8px 0;">
        <div id="present-reveal-icon" style="font-size:52px;">🎁</div>
        <div id="present-reveal-title" style="font-family:'Zen Kurenaido',cursive;font-size:clamp(13px,3.5vw,17px);color:#f0cc78;text-shadow:0 0 30px rgba(212,168,76,0.8);letter-spacing:2px;line-height:1.5;white-space:nowrap;"></div>
        <div id="present-reveal-img-wrap" style="display:none;width:100%;max-width:340px;border-radius:12px;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,0.5);">
          <img id="present-reveal-img" src="" alt="" style="width:100%;display:block;max-height:52vh;object-fit:contain;">
        </div>
        <div style="background:linear-gradient(135deg,rgba(212,168,76,0.12),rgba(244,114,182,0.08));border:1px solid rgba(212,168,76,0.35);border-radius:16px;padding:20px 24px;max-width:300px;width:100%;">
          <div id="present-reveal-msg" style="font-size:12px;color:#fce7f3;line-height:2.2;opacity:0.95;white-space:pre-line;"></div>
        </div>
        <button id="present-reveal-close" style="background:linear-gradient(135deg,#e879a0,#f9a8d4,#e879a0);color:white;border:none;border-radius:999px;padding:15px 48px;font-family:'Zen Kurenaido',cursive;font-size:15px;letter-spacing:3px;cursor:pointer;box-shadow:0 4px 24px rgba(232,121,160,0.6);">とじる 💕</button>
        <button id="btn-play-again" class="play-btn" style="font-size:14px;padding:12px 36px;">もう一度あそぶ</button>
      </div>

    </div>
  </div>
</div>

<script>
/* =============================================
   SETTINGS
============================================= */
const GOAL             = 50;
const BEST_KEY         = 'hf_best_v1';
const CLEARED_KEY      = 'hf_cleared_v1';
const ENDLESS_BEST_KEY = 'hf_endless_best_v1';

/* =============================================
   CANVAS SETUP
============================================= */
const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');
let W, H;

function resizeCanvas() {
  const wrap = document.getElementById('game-wrap');
  W = canvas.width  = wrap.clientWidth;
  H = canvas.height = wrap.clientHeight;
}
resizeCanvas();
window.addEventListener('resize', () => { resizeCanvas(); if (state === 'idle' || state === 'dead') drawBackground(); });

/* =============================================
   GAME STATE
============================================= */
let state = 'idle'; // idle | playing | dead | clear
let score = 0;
let bestScore = parseInt(localStorage.getItem(BEST_KEY) || '0');
let goalReached = false;
let raf = null;
let gameMode = 'normal'; // 'normal' | 'endless'
let pendingUnlockAnim = false;

/* =============================================
   PLAYER (Heart)
============================================= */
const GRAVITY    = 0.38;
const FLAP_VEL   = -7.5;
const HEART_SIZE = 28;

let player = { x: 0, y: 0, vy: 0, rotation: 0 };

function resetPlayer() {
  player.x  = W * 0.28;
  player.y  = H * 0.45;
  player.vy = 0;
  player.rotation = 0;
}

function drawHeartShape(cx_, cy_, size, color, alpha) {
  ctx.save();
  ctx.translate(cx_, cy_);
  ctx.globalAlpha = alpha || 1;
  ctx.fillStyle = color || '#f472b6';
  ctx.shadowColor = color || '#f472b6';
  ctx.shadowBlur = 12;
  ctx.beginPath();
  const s = size * 0.5;
  ctx.moveTo(0, -s * 0.35);
  ctx.bezierCurveTo( s * 1.1, -s * 0.9,  s * 2.2, s * 0.2,  0, s * 1.4);
  ctx.bezierCurveTo(-s * 2.2, s * 0.2,  -s * 1.1, -s * 0.9,  0, -s * 0.35);
  ctx.fill();
  ctx.restore();
}

function updatePlayer() {
  player.vy += GRAVITY;
  player.y  += player.vy;
  player.rotation = Math.min(Math.PI * 0.4, Math.max(-Math.PI * 0.35, player.vy * 0.055));
  // 天井
  if (player.y - HEART_SIZE * 0.7 < 0) { player.y = HEART_SIZE * 0.7; player.vy = 2; }
  // 床
  if (player.y + HEART_SIZE * 0.7 > H) return true; // dead
  return false;
}

function flap() { player.vy = FLAP_VEL; spawnFlapParticles(); }

/* =============================================
   PIPES (Ribbon obstacles)
============================================= */
const PIPE_W     = 52;
const PIPE_GAP   = 210;
const PIPE_SPEED = 2.8;
const PIPE_INTERVAL = 88; // フレーム間隔

let pipes = [];
let pipeTimer = 0;

function spawnPipe() {
  const minY = H * 0.18;
  const maxY = H * 0.68;
  const topH = minY + Math.random() * (maxY - minY);
  pipes.push({ x: W + PIPE_W, topH, passed: false });
}

function updatePipes() {
  pipeTimer++;
  if (pipeTimer >= PIPE_INTERVAL) { pipeTimer = 0; spawnPipe(); }

  for (let i = pipes.length - 1; i >= 0; i--) {
    pipes[i].x -= PIPE_SPEED;

    // スコア
    if (!pipes[i].passed && pipes[i].x + PIPE_W < player.x) {
      pipes[i].passed = true;
      score++;
      updateScoreDisplay();
      if (gameMode === 'normal' && score >= GOAL && !goalReached) { goalReached = true; triggerClear(); return; }
    }

    // 衝突判定
    if (collidesWithPipe(pipes[i])) return true;

    if (pipes[i].x + PIPE_W < 0) pipes.splice(i, 1);
  }
  return false;
}

function collidesWithPipe(pipe) {
  const r = HEART_SIZE * 0.55;
  const px = player.x, py = player.y;
  if (px + r < pipe.x || px - r > pipe.x + PIPE_W) return false;
  if (py - r < pipe.topH || py + r > pipe.topH + PIPE_GAP) return true;
  return false;
}

/* =============================================
   DRAW
============================================= */
// 背景パーティクル（装飾）
let bgParticles = [];
function initBgParticles() {
  bgParticles = [];
  for (let i = 0; i < 40; i++) {
    bgParticles.push({ x: Math.random()*W, y: Math.random()*H, r: Math.random()*1.2+0.2, a: Math.random(), da: (Math.random()*0.2+0.05)*(Math.random()<.5?1:-1)/60 });
  }
}
initBgParticles();

function drawBackground() {
  // グラデ背景
  const grd = ctx.createLinearGradient(0, 0, 0, H);
  grd.addColorStop(0, '#1a0a14');
  grd.addColorStop(0.5, '#2a0d20');
  grd.addColorStop(1, '#1a0a14');
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, W, H);

  // 星
  bgParticles.forEach(p => {
    p.a += p.da; if (p.a > 1 || p.a < 0.05) p.da *= -1;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
    ctx.fillStyle = `rgba(252,231,243,${p.a.toFixed(2)})`; ctx.fill();
  });
}

function drawPipe(pipe) {
  const x = pipe.x, tw = PIPE_W;

  // ===== 上パイプ（リボンポール） =====
  // 本体
  const topGrd = ctx.createLinearGradient(x, 0, x + tw, 0);
  topGrd.addColorStop(0, '#d4187a');
  topGrd.addColorStop(0.4, '#f472b6');
  topGrd.addColorStop(1, '#c0527a');
  ctx.fillStyle = topGrd;
  ctx.beginPath();
  ctx.roundRect(x, 0, tw, pipe.topH - 4, [0, 0, 6, 6]);
  ctx.fill();
  // キャップ
  const capGrd = ctx.createLinearGradient(x-4, 0, x+tw+4, 0);
  capGrd.addColorStop(0, '#e8cc78'); capGrd.addColorStop(1, '#c8a040');
  ctx.fillStyle = capGrd;
  ctx.beginPath(); ctx.roundRect(x - 5, pipe.topH - 20, tw + 10, 20, 5); ctx.fill();
  // リボン柄 (水平ストライプ)
  ctx.globalAlpha = 0.18;
  ctx.fillStyle = '#fff';
  for (let yy = 10; yy < pipe.topH - 22; yy += 18) {
    ctx.fillRect(x + 2, yy, tw - 4, 8);
  }
  ctx.globalAlpha = 1;

  // ===== 下パイプ =====
  const botY = pipe.topH + PIPE_GAP;
  ctx.fillStyle = topGrd;
  ctx.beginPath(); ctx.roundRect(x, botY + 4, tw, H - botY - 4, [6, 6, 0, 0]); ctx.fill();
  ctx.fillStyle = capGrd;
  ctx.beginPath(); ctx.roundRect(x - 5, botY, tw + 10, 20, 5); ctx.fill();
  ctx.globalAlpha = 0.18; ctx.fillStyle = '#fff';
  for (let yy = botY + 26; yy < H; yy += 18) { ctx.fillRect(x + 2, yy, tw - 4, 8); }
  ctx.globalAlpha = 1;
}

function drawPlayer() {
  ctx.save();
  ctx.translate(player.x, player.y);
  ctx.rotate(player.rotation);
  // 外側グロー
  ctx.shadowColor = '#f472b6'; ctx.shadowBlur = 18;
  drawHeartShape(0, 0, HEART_SIZE, '#f472b6');
  ctx.shadowBlur = 0;
  // ハイライト
  drawHeartShape(-HEART_SIZE*0.18, -HEART_SIZE*0.18, HEART_SIZE*0.38, 'rgba(255,255,255,0.35)');
  ctx.restore();
}

function drawHUD() {
  // スコア (左上)
  ctx.font = `bold 22px 'Zen Kurenaido', cursive`;
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillStyle = 'rgba(252,231,243,0.85)';
  ctx.shadowColor = 'rgba(244,114,182,0.6)'; ctx.shadowBlur = 8;
  ctx.fillText(`⭐ ${score}`, W * 0.05, H * 0.06);
  ctx.shadowBlur = 0;
  // ゴールまで
  if (score < GOAL) {
    ctx.font = `12px 'Zen Kurenaido', cursive`;
    ctx.fillStyle = 'rgba(212,168,76,0.7)';
    ctx.fillText(`🏆 あと ${GOAL - score}`, W * 0.05, H * 0.06 + 28);
  }
}

/* =============================================
   FLAP PARTICLES
============================================= */
let flapParticles = [];
function spawnFlapParticles() {
  for (let i = 0; i < 5; i++) {
    flapParticles.push({
      x: player.x, y: player.y,
      vx: (Math.random() - 0.5) * 3,
      vy: Math.random() * 2 + 1,
      life: 1, color: Math.random() < 0.5 ? '#f472b6' : '#f0cc78',
      size: Math.random() * 5 + 3,
    });
  }
}
function updateAndDrawFlapParticles() {
  for (let i = flapParticles.length - 1; i >= 0; i--) {
    const p = flapParticles[i];
    p.x += p.vx; p.y += p.vy; p.life -= 0.06;
    if (p.life <= 0) { flapParticles.splice(i, 1); continue; }
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* =============================================
   GAME LOOP
============================================= */
let lastTime = 0;
function gameLoop(ts) {
  if (state !== 'playing') return;
  raf = requestAnimationFrame(gameLoop);

  drawBackground();
  pipes.forEach(p => drawPipe(p));
  updateAndDrawFlapParticles();
  drawPlayer();
  drawHUD();

  const hitFloor = updatePlayer();
  const hitPipe  = updatePipes();

  if (hitFloor || hitPipe) {
    state = 'dead';
    if (score > bestScore) { bestScore = score; localStorage.setItem(BEST_KEY, bestScore); }
    showGameOver();
  }
}

/* =============================================
   🎁 PRESENT — index.html と同じ仕様
   ─────────────────────────────────────────
   GAME_PRESENT: ゲームクリア時に出るプレゼント設定
   index.html の PRESENT_SCHEDULE と同じ形式。
   date は "game-clear" 固定（日付に関係なく
   クリアしたら一度だけ出る）。
   ─────────────────────────────────────────
============================================= */
const GAME_PRESENT = {
  date:    'game-clear',
  title:   'ハートフラッピークリア報酬💕',
  message: 'ゲームクリアおめでとう！！\n疲れたときはいつでも何回でも使ってね🎫\n夏希専属のマッサージ師が担当します🫡',
  image:   'relax_ticket.jpg'
};

// index.html と共有する opened プレゼントキー
const K_OPENED = 'bdg_opened_presents_v1';
function getOpened(){try{return JSON.parse(localStorage.getItem(K_OPENED))||[];}catch{return[];}}
function setOpened(a){localStorage.setItem(K_OPENED,JSON.stringify(a));}

/* プレゼント背景パーティクル */
let presentBgRaf = null;
function startPresentBg(){
  const canvas = document.getElementById('present-bg-canvas');
  const cx = canvas.getContext('2d');
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  let particles = [], timer = 0;
  function burst(){
    const bx=Math.random()*canvas.width, by=Math.random()*canvas.height*0.65;
    const cols=['#f472b6','#fba8d0','#f0cc78','#fce7f3','#fb7185','#d4a84c'];
    for(let i=0;i<22;i++){
      const a=Math.random()*Math.PI*2, sp=1.5+Math.random()*4;
      particles.push({x:bx,y:by,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2.5,color:cols[~~(Math.random()*cols.length)],life:1,size:3+Math.random()*5});
    }
  }
  function frame(){
    cx.clearRect(0,0,canvas.width,canvas.height);
    timer++; if(timer%35===0) burst();
    for(let i=particles.length-1;i>=0;i--){
      const p=particles[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.1; p.life-=0.016;
      if(p.life<=0){particles.splice(i,1);continue;}
      cx.globalAlpha=p.life; cx.fillStyle=p.color;
      cx.beginPath(); cx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2); cx.fill();
    }
    cx.globalAlpha=1;
    presentBgRaf=requestAnimationFrame(frame);
  }
  frame();
}
function stopPresentBg(){cancelAnimationFrame(presentBgRaf);}

/* プレゼントオーバーレイ表示 */
function showPresentOverlay(pData){
  const overlay  = document.getElementById('present-overlay');
  const phBox    = document.getElementById('present-phase-box');
  const phReveal = document.getElementById('present-phase-reveal');
  const box      = document.getElementById('present-box-svg');

  phBox.style.display    = 'flex';
  phReveal.style.display = 'none';
  box.className = '';
  overlay.style.display  = 'flex';

  let shakeInt = setInterval(()=>{
    box.classList.add('box-shaking');
    setTimeout(()=>box.classList.remove('box-shaking'), 500);
  }, 2200);

  function openBox(){
    clearInterval(shakeInt);
    document.getElementById('present-box-wrap').removeEventListener('click', openBox);
    box.classList.add('box-bursting');
    launchConfetti(130);
    startPresentBg();
    setTimeout(()=>{
      phBox.style.display = 'none';
      // コンテンツをセット
      document.getElementById('present-reveal-title').textContent = pData.title || 'プレゼント 🎁';
      document.getElementById('present-reveal-msg').textContent   = pData.message || '';
      const iw = document.getElementById('present-reveal-img-wrap');
      const ri = document.getElementById('present-reveal-img');
      if(pData.image){ iw.style.display='block'; ri.src='photos/'+pData.image; }
      else { iw.style.display='none'; }
      phReveal.style.display = 'flex';
      phReveal.classList.add('show');

      // index.html の opened リストに追記（共有）
      const opened = getOpened();
      if(!opened.find(p=>p.date===pData.date)){
        opened.push({date:pData.date, title:pData.title||'プレゼント', message:pData.message||'', image:pData.image||''});
        setOpened(opened);
      }

      setTimeout(()=>launchConfetti(80),  700);
      setTimeout(()=>launchConfetti(60), 1500);
    }, 700);
  }
  document.getElementById('present-box-wrap').addEventListener('click', openBox);
}

/* とじるボタン */
document.getElementById('present-reveal-close').addEventListener('click', ()=>{
  stopPresentBg();
  document.getElementById('present-overlay').style.display = 'none';
  if (state === 'clear') { showClearOverlay(); }
  else { document.getElementById('overlay-gameover').classList.remove('hidden'); }
});

document.getElementById('btn-play-again').addEventListener('click', ()=>{
  stopPresentBg();
  document.getElementById('present-overlay').style.display = 'none';
  startGame('normal');
});

/* =============================================
   CLEAR トリガー
============================================= */
function triggerClear() {
  state = 'clear';
  cancelAnimationFrame(raf);
  if (score > bestScore) { bestScore = score; localStorage.setItem(BEST_KEY, bestScore); }
  launchConfetti();
  setTimeout(() => launchConfetti(), 600);
  // 初クリア判定
  if (!localStorage.getItem(CLEARED_KEY)) {
    localStorage.setItem(CLEARED_KEY, '1');
    pendingUnlockAnim = true;
  }
  document.getElementById('overlay-gameover').classList.add('hidden');
  setTimeout(showClearOverlay, 800);
}

function showClearOverlay() {
  document.getElementById('cl-score').textContent = `スコア：${score}`;
  document.getElementById('cl-best').textContent  = `ベスト：${bestScore}`;
  const pBtn = document.getElementById('cl-present-btn');
  const received = getOpened().find(p => p.date === GAME_PRESENT.date);
  if (received) {
    pBtn.textContent = '🎁 受け取り済み';
    pBtn.disabled = true; pBtn.style.opacity = '0.45'; pBtn.style.boxShadow = 'none';
  } else {
    pBtn.textContent = '🎁 プレゼントを受け取る';
    pBtn.disabled = false; pBtn.style.opacity = ''; pBtn.style.boxShadow = '';
  }
  document.getElementById('overlay-clear').classList.remove('hidden');
}

function goToStart() {
  state = 'idle';
  ['overlay-clear','overlay-gameover'].forEach(id => document.getElementById(id).classList.add('hidden'));
  document.getElementById('present-overlay').style.display = 'none';
  stopPresentBg();
  document.getElementById('overlay-start').classList.remove('hidden');
  drawBackground();
  updateEndlessButton();
  if (pendingUnlockAnim) { pendingUnlockAnim = false; setTimeout(triggerUnlockAnim, 500); }
}

function updateEndlessButton() {
  const btn = document.getElementById('endless-btn');
  localStorage.getItem(CLEARED_KEY) ? btn.classList.remove('hidden') : btn.classList.add('hidden');
}

function triggerUnlockAnim() {
  const btn = document.getElementById('endless-btn');
  btn.classList.remove('hidden');
  btn.classList.add('unlocking');
  btn.addEventListener('animationend', () => btn.classList.remove('unlocking'), { once: true });
  launchConfetti(60);
  const msg = document.createElement('div');
  msg.style.cssText = "position:fixed;top:50%;left:50%;font-family:'Zen Kurenaido',cursive;font-size:clamp(16px,5vw,26px);color:#a78bfa;text-shadow:0 0 20px rgba(167,139,250,0.9),0 0 40px rgba(167,139,250,0.5);pointer-events:none;z-index:100;animation:unlockMsg 1.8s ease-out forwards;letter-spacing:3px;white-space:nowrap;";
  msg.textContent = '✨ エンドレスモード解放！';
  document.body.appendChild(msg);
  msg.addEventListener('animationend', () => msg.remove());
}

/* =============================================
   GAME OVER
============================================= */
function showGameOver() {
  cancelAnimationFrame(raf);
  if (gameMode === 'endless') {
    const eb = parseInt(localStorage.getItem(ENDLESS_BEST_KEY) || '0');
    if (score > eb) localStorage.setItem(ENDLESS_BEST_KEY, score);
    document.getElementById('go-score').textContent = `エンドレス：${score}`;
    document.getElementById('go-best').textContent  = `ベスト：${Math.max(score, eb)}`;
    document.getElementById('goal-msg').style.display = 'none';
    document.getElementById('go-hint').style.display  = 'none';
  } else {
    document.getElementById('go-score').textContent = `スコア：${score}`;
    document.getElementById('go-best').textContent  = `ベスト：${bestScore}`;
    document.getElementById('goal-msg').style.display = 'none';
    const alreadyCleared = localStorage.getItem(CLEARED_KEY);
    if (!alreadyCleared) {
      document.getElementById('go-hint').style.display = 'block';
      document.getElementById('go-remain').textContent = Math.max(0, GOAL - score);
    } else {
      document.getElementById('go-hint').style.display = 'none';
    }
  }
  document.getElementById('overlay-gameover').classList.remove('hidden');
}

/* =============================================
   CONTROLS
============================================= */
function startGame(mode) {
  gameMode = mode || 'normal';
  state = 'playing'; score = 0; goalReached = false; pipes = []; pipeTimer = 60; flapParticles = [];
  resetPlayer(); updateScoreDisplay();
  ['overlay-start','overlay-gameover','overlay-clear'].forEach(id =>
    document.getElementById(id).classList.add('hidden')
  );
  document.getElementById('present-overlay').style.display = 'none';
  stopPresentBg();
  raf = requestAnimationFrame(gameLoop);
}

function handleInput() {
  if (state === 'playing') flap();
  else if (state === 'idle') startGame('normal');
}

canvas.addEventListener('click', handleInput);
canvas.addEventListener('touchstart', e => { e.preventDefault(); handleInput(); }, { passive: false });
document.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); handleInput(); } });

document.getElementById('btn-start').addEventListener('click', () => startGame('normal'));
document.getElementById('btn-retry').addEventListener('click', () => startGame(gameMode));
document.getElementById('btn-retry-clear').addEventListener('click', () => startGame('normal'));
document.getElementById('cl-start-btn').addEventListener('click', goToStart);
document.getElementById('go-start-btn').addEventListener('click', goToStart);
document.getElementById('endless-btn').addEventListener('click', () => startGame('endless'));
document.getElementById('cl-present-btn').addEventListener('click', () => {
  if (getOpened().find(p => p.date === GAME_PRESENT.date)) return;
  document.getElementById('overlay-clear').classList.add('hidden');
  showPresentOverlay(GAME_PRESENT);
});

function updateScoreDisplay() {
  document.getElementById('score-display').textContent =
    gameMode === 'endless' ? `⭐ ${score}` : `⭐ ${score} / ${GOAL}`;
}

/* =============================================
   🔧 DEBUG COMMAND
   ゲームオーバー画面で "debug" とキー入力するか
   スコア表示を5回タップするとデバッグメニューが出る
============================================= */
const DEBUG_CMD = 'debug';
let debugBuffer = '';
let debugTapCount = 0, debugTapTimer = null;
const debugHint = document.getElementById('debug-hint');

// キーボード入力
document.addEventListener('keydown', e => {
  if (!document.getElementById('overlay-gameover').classList.contains('hidden')) {
    debugBuffer += e.key.toLowerCase();
    if (debugBuffer.length > DEBUG_CMD.length) debugBuffer = debugBuffer.slice(-DEBUG_CMD.length);
    if (debugBuffer === DEBUG_CMD) { debugBuffer = ''; openDebugMenu(); }
  } else {
    debugBuffer = '';
  }
});

// スコア表示タップ（モバイル用）
document.getElementById('go-score').addEventListener('click', () => {
  debugTapCount++;
  clearTimeout(debugTapTimer);
  debugTapTimer = setTimeout(() => { debugTapCount = 0; debugHint.textContent = ''; debugHint.classList.remove('active'); }, 2000);
  const hints = ['・','・・','・・・','・・・・','debug'];
  debugHint.textContent = hints[Math.min(debugTapCount - 1, 4)] || '';
  if (debugTapCount >= 5) { debugTapCount = 0; clearTimeout(debugTapTimer); openDebugMenu(); }
});

function openDebugMenu() {
  debugHint.textContent = '';
  debugHint.classList.remove('active');

  const existing = document.getElementById('debug-overlay');
  if (existing) existing.remove();

  // パネル本体
  const panel = document.createElement('div');
  panel.id = 'debug-overlay';
  panel.style.cssText = 'position:fixed;inset:0;z-index:200;background:rgba(5,1,8,0.96);backdrop-filter:blur(14px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:32px 24px;';

  // ラベル
  const lbl = document.createElement('div');
  lbl.style.cssText = 'font-size:11px;letter-spacing:3px;color:rgba(212,168,76,0.6);margin-bottom:4px;';
  lbl.textContent = '🔧 DEBUG MODE';
  panel.appendChild(lbl);

  const title = document.createElement('div');
  title.style.cssText = "font-family:'Zen Kurenaido',cursive;font-size:20px;color:var(--cream);letter-spacing:2px;margin-bottom:8px;";
  title.textContent = 'デバッグメニュー';
  panel.appendChild(title);

  // ボタン共通スタイル生成
  function makeBtn(label, color, bg) {
    const b = document.createElement('button');
    b.style.cssText = 'width:240px;padding:13px 20px;border-radius:10px;background:' + bg + ';border:1px solid ' + color + ';color:' + color + ";font-family:'Zen Kurenaido',cursive;font-size:14px;letter-spacing:1px;cursor:pointer;transition:opacity 0.2s;";
    b.textContent = label;
    b.onmouseenter = function() { this.style.opacity = '0.75'; };
    b.onmouseleave = function() { this.style.opacity = '1'; };
    return b;
  }

  const btnClear = makeBtn('🎉 クリア画面を表示', '#e879a0', 'rgba(232,121,160,0.2)');
  btnClear.onclick = function() {
    panel.remove();
    document.getElementById('overlay-gameover').classList.add('hidden');
    triggerClear();
  };
  panel.appendChild(btnClear);

  const btnPresent = makeBtn('🎁 プレゼント画面を表示', '#f0cc78', 'rgba(212,168,76,0.15)');
  btnPresent.onclick = function() {
    panel.remove();
    document.getElementById('overlay-gameover').classList.add('hidden');
    showPresentOverlay(GAME_PRESENT);
  };
  panel.appendChild(btnPresent);

  const btnReset = makeBtn('🗑 ベストスコアをリセット', '#fba8d0', 'rgba(244,114,182,0.12)');
  btnReset.onclick = function() {
    localStorage.removeItem(BEST_KEY);
    bestScore = 0;
    document.getElementById('go-best').textContent = 'ベスト：0';
    panel.remove();
    showToast('ベストスコアをリセットしました');
  };
  panel.appendChild(btnReset);

  // 閉じるボタン
  const btnClose = document.createElement('button');
  btnClose.style.cssText = "margin-top:8px;background:none;border:1px solid rgba(244,114,182,0.25);border-radius:999px;color:var(--dim);padding:10px 32px;font-family:'Zen Kurenaido',cursive;font-size:13px;letter-spacing:2px;cursor:pointer;";
  btnClose.textContent = 'とじる';
  btnClose.onclick = function() { panel.remove(); };
  panel.appendChild(btnClose);

  document.body.appendChild(panel);
}

function showToast(msg) {
  const t = document.createElement('div');
  t.style.cssText = 'position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:rgba(212,168,76,0.2);border:1px solid rgba(212,168,76,0.4);border-radius:999px;color:var(--gold-l);padding:10px 24px;font-size:13px;letter-spacing:1px;z-index:999;';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2200);
}

/* =============================================
   CONFETTI
============================================= */
function launchConfetti() {
  const colors = ['#f472b6','#fba8d0','#fce7f3','#fb7185','#ffffff','#f0cc78','#fbcfe8'];
  for (let i = 0; i < 80; i++) {
    const el = document.createElement('div'); el.className = 'confetti-piece';
    const sz = 6 + Math.random() * 9;
    const br = Math.random() < 0.6 ? '50%' : '2px';
    el.style.cssText = 'left:' + (Math.random()*100) + 'vw;width:' + sz + 'px;height:' + sz + 'px;background:' + colors[Math.floor(Math.random()*colors.length)] + ';border-radius:' + br + ';animation-duration:' + (2.4+Math.random()*2) + 's;animation-delay:' + (Math.random()*.7) + 's;';
    document.body.appendChild(el);
    el.addEventListener('animationend', () => el.remove());
  }
}

/* ===== INITIAL DRAW ===== */
updateEndlessButton();
drawBackground();
drawHeartShape(W * 0.28, H * 0.45, HEART_SIZE, '#f472b6');
</script>
