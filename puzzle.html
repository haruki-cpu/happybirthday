<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>思い出スライドパズル 🧩</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kurenaido&family=Cormorant+Garamond:ital@1&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #1a0a14;
  --pink: #f472b6;
  --pink-l: #fba8d0;
  --pink-d: #c0527a;
  --gold: #d4a84c;
  --gold-l: #f0cc78;
  --cream: #fdf0f5;
  --text: #fce7f3;
  --dim: rgba(252,231,243,0.45);
  --border: rgba(244,114,182,0.22);
  --panel: rgba(244,114,182,0.07);
  --glow: rgba(244,114,182,0.35);
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; background: var(--bg); overflow: hidden; }
body {
  font-family: 'Zen Kurenaido', cursive;
  display: flex; flex-direction: column;
  align-items: center; color: var(--text);
}

/* ===== BG CANVAS ===== */
#bg-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

/* ===== GAME WRAP ===== */
#game-wrap {
  position: relative; z-index: 1;
  width: 100%; height: 100%; max-width: 480px;
  display: flex; flex-direction: column; align-items: center;
  overflow: hidden;
}

/* ===== TOP BAR ===== */
#top-bar {
  width: 100%; flex-shrink: 0;
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 16px; z-index: 20;
}
#back-btn {
  background: rgba(244,114,182,0.12); border: 1px solid rgba(244,114,182,0.3);
  border-radius: 999px; color: var(--pink-l); padding: 7px 16px;
  font-family: 'Zen Kurenaido', cursive; font-size: 13px; letter-spacing: 1px;
  cursor: pointer; text-decoration: none; transition: background 0.2s;
  -webkit-tap-highlight-color: transparent; flex-shrink: 0;
}
#back-btn:hover { background: rgba(244,114,182,0.22); }
#hud { display: flex; gap: 14px; align-items: center; }
#hud-moves { font-size: 12px; color: var(--gold-l); letter-spacing: 1px; }
#hud-timer {
  font-size: 20px; font-weight: bold; color: var(--gold-l);
  min-width: 54px; text-align: center; transition: color 0.3s;
  text-shadow: 0 0 10px rgba(212,168,76,0.4);
}
#hud-timer.warn {
  color: #fb7185; animation: timerPulse 0.5s ease-in-out infinite;
  text-shadow: 0 0 14px rgba(251,113,133,0.8);
}
@keyframes timerPulse { 0%,100%{opacity:1;} 50%{opacity:0.35;} }
#giveup-btn {
  background: rgba(251,113,133,0.15); border: 1px solid rgba(251,113,133,0.3);
  border-radius: 999px; color: #fda4af; padding: 7px 12px;
  font-size: 12px; letter-spacing: 1px; cursor: pointer;
  transition: background 0.2s; display: none; flex-shrink: 0;
  -webkit-tap-highlight-color: transparent; font-family: 'Zen Kurenaido', cursive;
}
#giveup-btn:hover { background: rgba(251,113,133,0.28); }
#giveup-btn.show { display: block; }

/* ===== TIMER BAR ===== */
#timer-bar-wrap { width: 100%; height: 4px; flex-shrink: 0; background: rgba(244,114,182,0.1); }
#timer-bar {
  height: 100%; width: 100%;
  background: linear-gradient(90deg, var(--gold), var(--pink));
  transition: width 0.95s linear, background 0.4s;
}
#timer-bar.warn { background: linear-gradient(90deg, #fb7185, #f43f5e); }

/* ===== GAME AREA ===== */
#game-area {
  flex: 1; width: 100%; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  padding: 8px 16px 8px;
}

/* ===== PUZZLE BOARD ===== */
#puzzle-board {
  position: relative;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 0 0 2px rgba(244,114,182,0.2), 0 16px 48px rgba(0,0,0,0.5);
}

/* ===== TILE ===== */
.tile {
  position: absolute;
  border-radius: 5px;
  overflow: hidden;
  cursor: pointer;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08), 0 2px 6px rgba(0,0,0,0.35);
  transition: box-shadow 0.2s;
  will-change: left, top;
}
.tile::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(145deg, rgba(255,255,255,0.14) 0%, transparent 55%);
  pointer-events: none;
}
.tile:active { opacity: 0.85; }
.tile.sliding {
  transition: left 0.2s cubic-bezier(0.34,1.56,0.64,1),
              top  0.2s cubic-bezier(0.34,1.56,0.64,1),
              box-shadow 0.2s;
  box-shadow: inset 0 0 0 2px rgba(244,114,182,0.6),
              0 8px 28px rgba(244,114,182,0.45), 0 2px 8px rgba(0,0,0,0.4);
  z-index: 10 !important;
}

.tile.matched-glow { animation: matchedGlow 0.55s ease-out forwards; }
@keyframes matchedGlow {
  0%  { box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08), 0 2px 6px rgba(0,0,0,0.35); }
  40% { box-shadow: inset 0 0 0 3px var(--gold-l), 0 0 28px rgba(212,168,76,0.85); }
  100%{ box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08), 0 2px 6px rgba(0,0,0,0.35); }
}

/* シャッフル入場 */
@keyframes shuffleIn {
  from{ opacity: 0; transform: scale(0.55) rotate(-10deg); }
  to  { opacity: 1; transform: scale(1)    rotate(0deg); }
}
.tile.shuffle-in { animation: shuffleIn 0.38s cubic-bezier(0.34,1.56,0.64,1) both; }

/* ===== PREVIEW STRIP ===== */
#preview-strip {
  width: 100%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  gap: 10px; padding: 4px 16px 8px;
  opacity: 0; transition: opacity 0.4s;
}
#preview-strip.show { opacity: 1; }
#preview-img {
  width: 40px; height: 40px; border-radius: 8px; object-fit: cover; aspect-ratio: 1;
  border: 1px solid rgba(244,114,182,0.45);
  box-shadow: 0 0 12px rgba(244,114,182,0.22);
  cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
}
#preview-img:hover { transform: scale(1.1); box-shadow: 0 0 20px rgba(244,114,182,0.5); }
#preview-label { font-size: 11px; color: var(--dim); letter-spacing: 1.5px; }

/* ===== FLASH / VIGNETTE ===== */
#flash-overlay { position: absolute; inset: 0; z-index: 20; pointer-events: none; opacity: 0; }
#flash-overlay.active { animation: flashRed 0.7s ease-out forwards; }
@keyframes flashRed {
  0%  { background: rgba(251,113,133,0.32); opacity: 1; }
  100%{ background: transparent; opacity: 0; }
}
#game-wrap.halfwarn::after {
  content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 5;
  animation: vigIn 0.4s ease-out forwards, vigPulse 1.1s 0.4s ease-in-out infinite alternate;
}
@keyframes vigIn   { from{box-shadow:inset 0 0 0 rgba(251,113,133,0);}   to{box-shadow:inset 0 0 70px rgba(251,113,133,0.38);} }
@keyframes vigPulse{ from{box-shadow:inset 0 0 50px rgba(251,113,133,0.25);} to{box-shadow:inset 0 0 90px rgba(251,113,133,0.52);} }
@keyframes screenShake {
  0%,100%{transform:translateX(0);} 15%{transform:translateX(-7px);} 30%{transform:translateX(7px);}
  45%{transform:translateX(-5px);}  60%{transform:translateX(5px);}  75%{transform:translateX(-3px);} 90%{transform:translateX(3px);}
}
.screen-shake { animation: screenShake 0.5s ease-in-out !important; }
@keyframes timerBounce {
  0%{transform:scale(1);} 25%{transform:scale(2.0);} 55%{transform:scale(0.85);}
  80%{transform:scale(1.25);} 100%{transform:scale(1);}
}
.timer-bounce { animation: timerBounce 0.5s cubic-bezier(0.36,0.07,0.19,0.97) !important; }

/* ===== COMPLETE REVEAL ===== */
#complete-reveal {
  position: absolute; inset: 0; z-index: 25;
  display: flex; align-items: center; justify-content: center;
  background: rgba(10,2,8,0.88); backdrop-filter: blur(5px);
  opacity: 0; pointer-events: none; transition: opacity 0.5s;
}
#complete-reveal.show { opacity: 1; pointer-events: auto; }
@keyframes completeFadeIn {
  from{ opacity: 0; transform: scale(0.88); }
  to  { opacity: 1; transform: scale(1); }
}
#complete-img-wrap {
  border-radius: 14px; overflow: hidden;
  box-shadow: 0 0 0 2px var(--pink-l), 0 20px 60px rgba(0,0,0,0.7),
              0 0 80px rgba(244,114,182,0.3);
  animation: completeFadeIn 0.75s cubic-bezier(0.22,1,0.36,1) forwards;
}
#complete-img-wrap img { display: block; width: 100%; max-width: 290px; border-radius: 14px; aspect-ratio: 1; object-fit: cover; }

/* ===== OVERLAYS ===== */
.overlay {
  position: absolute; inset: 0; z-index: 30;
  background: rgba(10,2,8,0.93); backdrop-filter: blur(12px);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 20px 24px; text-align: center;
  animation: fadeIn 0.4s ease; overflow-y: auto;
}
.overlay.hidden { display: none; }
@keyframes fadeIn { from{opacity:0;} to{opacity:1;} }
.ov-icon { font-size: 52px; margin-bottom: 10px; }
.ov-title {
  font-size: clamp(22px,5vw,34px); color: var(--cream); margin-bottom: 8px;
  text-shadow: 0 0 28px rgba(244,114,182,0.5);
}
.ov-sub { font-size: 12px; color: var(--dim); letter-spacing: 1.5px; margin-bottom: 18px; line-height: 2; }
.ov-score { font-size: 15px; color: var(--gold-l); letter-spacing: 2px; margin-bottom: 4px; }
.ov-best  { font-size: 12px; color: var(--dim); letter-spacing: 1px; margin-bottom: 16px; }
.ov-new-record { font-size: 13px; color: var(--pink-l); letter-spacing: 2px; margin-bottom: 6px; animation: glowP 1s ease-in-out 4; }
.ov-new-record.hidden { display: none; }
@keyframes glowP { 0%,100%{opacity:0.6;} 50%{opacity:1; text-shadow:0 0 14px rgba(244,114,182,0.9);} }
.ov-allclear-msg {
  font-size: 12px; color: var(--gold-l); letter-spacing: 1px; margin-bottom: 12px;
  background: rgba(212,168,76,0.1); border: 1px solid rgba(212,168,76,0.35);
  border-radius: 8px; padding: 8px 18px; line-height: 1.8;
}
.ov-allclear-msg.hidden { display: none; }

/* ===== クリア解放メッセージ ===== */
.ov-unlock-msg {
  font-size: 13px; color: var(--pink-l); letter-spacing: 1.5px; margin-bottom: 10px;
  background: rgba(244,114,182,0.1); border: 1px solid rgba(244,114,182,0.35);
  border-radius: 8px; padding: 8px 18px; line-height: 1.8;
  animation: unlockPulse 1.5s ease-in-out 3;
}
.ov-unlock-msg.hidden { display: none; }
@keyframes unlockPulse {
  0%,100%{ box-shadow: 0 0 0 rgba(244,114,182,0); }
  50%{ box-shadow: 0 0 18px rgba(244,114,182,0.5); }
}

/* ===== 難易度グリッド ===== */
#difficulty-grid {
  display: grid; grid-template-columns: repeat(3,1fr);
  gap: 9px; width: 100%; max-width: 340px; margin-bottom: 16px;
}
.diff-btn {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 12px; padding: 12px 6px;
  cursor: pointer; transition: background 0.2s, border-color 0.2s, transform 0.15s;
  -webkit-tap-highlight-color: transparent;
  display: flex; flex-direction: column; align-items: center; gap: 5px;
  font-family: 'Zen Kurenaido', cursive; position: relative; overflow: hidden;
}
.diff-btn:hover:not(:disabled):not(.locked) { background: rgba(244,114,182,0.16); border-color: var(--pink); }
.diff-btn.selected { background: rgba(244,114,182,0.2); border-color: var(--pink); }

/* ロック状態 */
.diff-btn.locked {
  opacity: 0.55; cursor: not-allowed;
  border-style: dashed; border-color: rgba(244,114,182,0.15);
  background: rgba(244,114,182,0.03);
}
.diff-btn.locked .diff-label { color: var(--dim); }

/* 解放アニメ */
@keyframes diffUnlock {
  0%  { transform: scale(1); box-shadow: 0 0 0 rgba(212,168,76,0); }
  30% { transform: scale(1.08); box-shadow: 0 0 24px rgba(212,168,76,0.7); }
  60% { transform: scale(0.96); }
  100%{ transform: scale(1); box-shadow: 0 0 0 rgba(212,168,76,0); }
}
.diff-btn.unlocking { animation: diffUnlock 0.7s cubic-bezier(0.34,1.56,0.64,1) forwards; }

.diff-label { font-size: 12px; color: var(--cream); letter-spacing: 1px; }
.diff-grid-size { font-size: 10px; color: var(--gold-l); letter-spacing: 1px; }
.diff-time { font-size: 9px; color: var(--dim); }
.diff-info { font-size: 9px; color: var(--dim); min-height: 12px; line-height: 1.4; }
.diff-cleared { font-size: 9px; color: var(--pink-l); }
.diff-cleared.hidden { display: none; }

/* ロックアイコン */
.diff-lock-icon { font-size: 16px; opacity: 0.4; }
.diff-lock-hint { font-size: 9px; color: var(--dim); line-height: 1.4; opacity: 0.8; }
.diff-lock-icon.hidden, .diff-lock-hint.hidden { display: none; }

/* ===== BUTTONS ===== */
.play-btn {
  background: linear-gradient(135deg, #e879a0, #f9a8d4, #e879a0);
  color: white; border: none; border-radius: 999px;
  padding: 14px 48px; font-family: 'Zen Kurenaido', cursive;
  font-size: 16px; letter-spacing: 3px; cursor: pointer;
  box-shadow: 0 4px 24px rgba(232,121,160,0.5);
  transition: transform 0.15s, box-shadow 0.15s;
  position: relative; overflow: hidden;
  -webkit-tap-highlight-color: transparent; margin-top: 8px;
}
.play-btn::after {
  content: ''; position: absolute; top: -60%; left: -60%; width: 220%; height: 220%;
  background: linear-gradient(115deg, transparent 35%, rgba(255,255,255,0.4) 50%, transparent 65%);
  animation: shine 3s linear infinite;
}
@keyframes shine { from{transform:translateX(-100%) rotate(20deg);} to{transform:translateX(100%) rotate(20deg);} }
.play-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 36px rgba(232,121,160,0.7); }
.play-btn:disabled { background: rgba(255,255,255,0.1); color: var(--dim); box-shadow: none; cursor: default; transform: none; }
.play-btn:disabled::after { display: none; }

.secondary-btn {
  font-size: 12px; color: var(--dim); letter-spacing: 1px;
  text-decoration: none; border: 1px solid rgba(244,114,182,0.22);
  border-radius: 999px; padding: 8px 22px;
  transition: background 0.2s, color 0.2s; display: inline-block;
  cursor: pointer; background: none; margin-top: 9px;
  font-family: 'Zen Kurenaido', cursive; -webkit-tap-highlight-color: transparent;
}
.secondary-btn:hover { background: rgba(244,114,182,0.1); color: var(--pink-l); }

/* プレゼントボタン */
#present-view-btn {
  padding: 12px 32px; margin-top: 16px;
  background: linear-gradient(135deg, rgba(212,168,76,0.18), rgba(244,114,182,0.1));
  border: 1px solid rgba(212,168,76,0.5); border-radius: 999px;
  color: var(--gold-l); font-family: 'Zen Kurenaido', cursive;
  font-size: 14px; letter-spacing: 2px; cursor: pointer;
  animation: goldGlow 2s ease-in-out infinite;
  -webkit-tap-highlight-color: transparent;
}
@keyframes goldGlow { 0%,100%{box-shadow:0 0 8px rgba(212,168,76,0.3);} 50%{box-shadow:0 0 24px rgba(212,168,76,0.7);} }
#present-view-btn.hidden { display: none; }
#unlock-hint { font-size: 11px; color: var(--pink-l); letter-spacing: 1px; margin-bottom: 10px; line-height: 1.7; display: none; }
#clear-progress { margin-top: 8px; font-size: 10px; color: var(--dim); letter-spacing: 2px; min-height: 14px; }

/* ===== PRESENT BOX ===== */
@keyframes hintPulse { 0%,100%{opacity:0.4;transform:translateY(0);} 50%{opacity:1;transform:translateY(-4px);} }
@keyframes boxShake  { 0%,100%{transform:rotate(0);} 20%{transform:rotate(-8deg) scale(1.05);} 40%{transform:rotate(8deg) scale(1.08);} 60%{transform:rotate(-5deg);} 80%{transform:rotate(4deg);} }
@keyframes boxBurst  { 0%{transform:scale(1);opacity:1;} 30%{transform:scale(1.4) rotate(-10deg);opacity:1;} 60%{transform:scale(1.6) rotate(15deg);opacity:0.5;} 100%{transform:scale(0) rotate(30deg);opacity:0;} }
@keyframes revealIn  { from{opacity:0;transform:scale(0.7) translateY(30px);} to{opacity:1;transform:scale(1) translateY(0);} }
@keyframes ringPulse { 0%{transform:scale(0.5);opacity:0.8;} 100%{transform:scale(2.5);opacity:0;} }
.tap-ring { position:absolute;inset:-10px;border-radius:50%;border:2px solid rgba(212,168,76,0.4);animation:ringPulse 1.8s ease-out infinite;pointer-events:none; }
.tap-ring:nth-child(2){animation-delay:0.6s;} .tap-ring:nth-child(3){animation-delay:1.2s;}
.box-shaking { animation:boxShake 0.5s ease-in-out; }
.box-bursting { animation:boxBurst 0.55s cubic-bezier(0.36,0.07,0.19,0.97) forwards; }
#present-phase-reveal.show { animation:revealIn 0.8s cubic-bezier(0.22,1,0.36,1) forwards; }

/* ===== CONFETTI / SPARKLE ===== */
.confetti-piece { position:fixed;top:-14px;pointer-events:none;z-index:999;animation:confettiFall linear forwards; }
@keyframes confettiFall { 0%{transform:translateY(0) rotate(0deg);opacity:1;} 80%{opacity:1;} 100%{transform:translateY(108vh) rotate(900deg);opacity:0;} }
.sparkle-piece { position:fixed;pointer-events:none;z-index:998;border-radius:50%;animation:sparkleFly var(--dur) ease-out forwards; }
@keyframes sparkleFly { 0%{transform:translate(0,0) scale(1);opacity:1;} 100%{transform:translate(var(--tx),var(--ty)) scale(0);opacity:0;} }

/* ===== DEBUG ===== */
#debug-hint { margin-top: 8px; font-size: 10px; color: rgba(252,231,243,0.18); letter-spacing: 2px; min-height: 14px; }
@keyframes heartbeat { 0%,100%{transform:scale(1);} 50%{transform:scale(1.22);} }
.hb { animation: heartbeat 1.4s ease-in-out infinite; display: inline-block; }
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div id="game-wrap">
  <div id="top-bar">
    <a id="back-btn" href="index.html">← もどる</a>
    <div id="hud">
      <span id="hud-moves">👆 0手</span>
      <span id="hud-timer">0:00</span>
    </div>
    <button id="giveup-btn">やめる</button>
  </div>

  <div id="timer-bar-wrap"><div id="timer-bar"></div></div>

  <div id="game-area">
    <div id="puzzle-board"></div>
  </div>

  <div id="preview-strip">
    <img id="preview-img" src="" alt="完成形" title="完成形を見る">
    <span id="preview-label">完成形 💕</span>
  </div>

  <div id="flash-overlay"></div>

  <div id="complete-reveal">
    <div id="complete-img-wrap">
      <img id="complete-img" src="" alt="完成！">
    </div>
  </div>

  <!-- ===== START OVERLAY ===== -->
  <div class="overlay" id="overlay-start">
    <div class="ov-icon"><span class="hb">🧩</span></div>
    <div class="ov-title">思い出スライドパズル</div>
    <div class="ov-sub">ピースをスライドして<br>写真を完成させてね 💕</div>
    <div id="unlock-hint"></div>
    <div id="difficulty-grid">
      <!-- かんたん：最初から解放 -->
      <button class="diff-btn selected" data-diff="easy">
        <div class="diff-label">かんたん</div>
        <div class="diff-grid-size">3 × 3</div>
        <div class="diff-time">3分</div>
        <div class="diff-info" id="diff-info-easy"></div>
        <div class="diff-cleared hidden" id="diff-cleared-easy">✅ クリア済み</div>
        <div class="diff-lock-icon hidden" id="diff-lock-icon-easy">🔒</div>
        <div class="diff-lock-hint hidden" id="diff-lock-hint-easy"></div>
      </button>
      <!-- ふつう：かんたんクリアで解放 -->
      <button class="diff-btn locked" data-diff="normal">
        <div class="diff-label">ふつう</div>
        <div class="diff-grid-size">4 × 4</div>
        <div class="diff-time">5分</div>
        <div class="diff-info" id="diff-info-normal"></div>
        <div class="diff-cleared hidden" id="diff-cleared-normal">✅ クリア済み</div>
        <div class="diff-lock-icon" id="diff-lock-icon-normal">🔒</div>
        <div class="diff-lock-hint" id="diff-lock-hint-normal">かんたんをクリアして解放</div>
      </button>
      <!-- むずかしい：ふつうクリアで解放 -->
      <button class="diff-btn locked" data-diff="hard">
        <div class="diff-label">むずかしい</div>
        <div class="diff-grid-size">5 × 5</div>
        <div class="diff-time">8分</div>
        <div class="diff-info" id="diff-info-hard"></div>
        <div class="diff-cleared hidden" id="diff-cleared-hard">✅ クリア済み</div>
        <div class="diff-lock-icon" id="diff-lock-icon-hard">🔒</div>
        <div class="diff-lock-hint" id="diff-lock-hint-hard">ふつうをクリアして解放</div>
      </button>
    </div>
    <button class="play-btn" id="btn-start">はじめる 💕</button>
    <div id="clear-progress"></div>
    <button id="present-view-btn" class="hidden">🎁 プレゼントを受け取る</button>
    <a href="index.html" class="secondary-btn">← メイン画面にもどる</a>
  </div>

  <!-- ===== CLEAR OVERLAY ===== -->
  <div class="overlay hidden" id="overlay-clear">
    <div class="ov-icon"><span class="hb">🎉</span></div>
    <div class="ov-title">パズル完成！</div>
    <div class="ov-score" id="cl-score"></div>
    <div class="ov-best"  id="cl-best"></div>
    <div class="ov-new-record hidden" id="cl-new-record">🏆 新記録！</div>
    <div class="ov-unlock-msg hidden" id="cl-unlock-msg"></div>

<script>
/* =============================================

============================================= */
const PUZZLE_PRESENT = {

const DIFFICULTIES = {

const BEST_KEY_PREFIX   = 'pzl_best_v1_';
const CLEARED_KEY       = 'pzl_cleared_v1';
const UNLOCKED_KEY      = 'pzl_unlocked_v1';
const K_PULLED          = 'bdg_pulled_v2';

/* =============================================

const PHOTO_LIST = [

  "BeautyPlus_20260320125542692_0_save.jpg","BeautyPlus_20260320150255059_0_save.jpg",
  "BeautyPlus_20260329125425893_0_save.jpg","BeautyPlus_20260405145128566_0_save.jpg",
  "BeautyPlus_20260418161756023_0_save.jpg","BeautyPlus_20260425185912785_0_save.jpg",
  "IMG_20251017_221706795.jpg","IMG_20251220_142237578.jpg","IMG_20251220_183333864.jpg",

/* =============================================
  ストレージ
============================================= */
function getUnlockedPhotos() {
  try {
    const pulled = JSON.parse(localStorage.getItem(K_PULLED)) || [];
    return [...new Set(pulled)].filter(i => i >= 0 && i < PHOTO_LIST.length).map(i => PHOTO_LIST[i]);
  } catch { return []; }
}
function getBest(diff)    { try { return JSON.parse(localStorage.getItem(BEST_KEY_PREFIX + diff)) || null; } catch { return null; } }
function setBest(diff, d) { localStorage.setItem(BEST_KEY_PREFIX + diff, JSON.stringify(d)); }
function getCleared()     { try { return JSON.parse(localStorage.getItem(CLEARED_KEY)) || {}; } catch { return {}; } }
function markCleared(diff){ const c = getCleared(); c[diff] = true; localStorage.setItem(CLEARED_KEY, JSON.stringify(c)); }
function isAllCleared()   { const c = getCleared(); return Object.keys(DIFFICULTIES).every(d => c[d]); }
function getOpened()      { try { return JSON.parse(localStorage.getItem(K_OPENED)) || []; } catch { return []; } }
function setOpened(a)     { localStorage.setItem(K_OPENED, JSON.stringify(a)); }

// 難易度解放状態の取得・保存
function getUnlocked() {
  try { return JSON.parse(localStorage.getItem(UNLOCKED_KEY)) || { easy: true }; }
  catch { return { easy: true }; }
}
function setUnlocked(obj) { localStorage.setItem(UNLOCKED_KEY, JSON.stringify(obj)); }

// 難易度が解放済みかどうか
function isDiffUnlocked(diff) {
  if (DIFFICULTIES[diff].unlockBy === null) return true; // easy は常に解放
  return getUnlocked()[diff] === true;
}

// クリア時に次の難易度を解放し、新解放があれば難易度名を返す
function tryUnlockNext(clearedDiff) {
  const unlocked = getUnlocked();
  const newly = [];
  Object.entries(DIFFICULTIES).forEach(([d, cfg]) => {
    if (cfg.unlockBy === clearedDiff && !unlocked[d]) {
      unlocked[d] = true;
      newly.push(d);
    }
  });
  if (newly.length) setUnlocked(unlocked);
  return newly; // 新しく解放した難易度の配列
}

function fmtTime(s) { return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; }
function bestStr(b) { return b ? `${b.moves}手 / 残り${fmtTime(b.timeLeft)}` : '--'; }

/* =============================================
  背景Canvas
============================================= */
(function BG() {
  const c = document.getElementById('bg-canvas'), cx = c.getContext('2d');
  let W, H, items = [];
  function resize() { W = c.width = window.innerWidth; H = c.height = window.innerHeight; generate(); }
  function generate() {
    items = [];
    for (let i=0;i<140;i++) items.push({ type:'star', x:Math.random()*W, y:Math.random()*H, r:Math.random()*1.2+0.2, a:Math.random(), da:(Math.random()*0.2+0.05)*(Math.random()<.5?1:-1)/60 });
    for (let i=0;i<14;i++)  items.push({ type:'heart', x:Math.random()*W, y:Math.random()*H, size:Math.random()*9+5, a:Math.random()*0.14+0.04, vy:-(Math.random()*0.22+0.07), vx:(Math.random()-0.5)*0.14, drift:Math.random()*Math.PI*2 });
  }
  function drawHeart(x,y,s,a) {
    cx.save(); cx.translate(x,y); cx.globalAlpha=a; cx.fillStyle='#f472b6';
    cx.beginPath(); cx.moveTo(0,-s*.35); cx.bezierCurveTo(s*.55,-s*.9,s*1.1,s*.1,0,s*.7); cx.bezierCurveTo(-s*1.1,s*.1,-s*.55,-s*.9,0,-s*.35); cx.fill(); cx.restore();
  }
  function frame() {
    cx.clearRect(0,0,W,H);
    items.forEach(it => {
      if (it.type==='star') { it.a+=it.da; if(it.a>1||it.a<0.04)it.da*=-1; cx.beginPath(); cx.arc(it.x,it.y,it.r,0,Math.PI*2); cx.fillStyle=`rgba(252,231,243,${it.a.toFixed(2)})`; cx.fill(); }
      else { it.drift+=0.007; it.y+=it.vy; it.x+=it.vx+Math.sin(it.drift)*0.1; if(it.y<-20){it.y=H+20;it.x=Math.random()*W;} drawHeart(it.x,it.y,it.size,it.a); }
    });
    requestAnimationFrame(frame);
  }
  resize(); frame(); window.addEventListener('resize', resize);
})();

/* =============================================
  ゲーム状態
============================================= */
let currentDiff = 'easy';
let gridSize = 3, timeLimit = 180, timeLeft = 180;
let timerInterval = null, moves = 0;
let tiles = [], boardSize = 0, tileSize = 0;
let currentPhoto = '', isLocked = false, halfWarnTriggered = false;

/* =============================================
  スタート画面更新
============================================= */
function updateStartScreen() {
  const unlocked     = getUnlockedPhotos();
  const cleared      = getCleared();
  const unlockedDiff = getUnlocked();
  const hasPhoto     = unlocked.length >= 1;

  Object.keys(DIFFICULTIES).forEach(diff => {
    const btn       = document.querySelector(`.diff-btn[data-diff="${diff}"]`);
    const infoEl    = document.getElementById('diff-info-' + diff);
    const clearEl   = document.getElementById('diff-cleared-' + diff);
    const lockIcon  = document.getElementById('diff-lock-icon-' + diff);
    const lockHint  = document.getElementById('diff-lock-hint-' + diff);
    const isOpen    = isDiffUnlocked(diff);

    if (isOpen) {
      btn.classList.remove('locked');
      lockIcon.classList.add('hidden');
      lockHint.classList.add('hidden');
      const b = getBest(diff);
      infoEl.textContent = b ? `🏆 ${bestStr(b)}` : '';
    } else {
      btn.classList.add('locked');
      btn.classList.remove('selected');
      lockIcon.classList.remove('hidden');
      lockHint.classList.remove('hidden');
      infoEl.textContent = '';
    }
    cleared[diff] ? clearEl.classList.remove('hidden') : clearEl.classList.add('hidden');
  });

  // 写真なし
  const hint = document.getElementById('unlock-hint');
  hint.style.display = hasPhoto ? 'none' : 'block';
  hint.textContent   = 'ガチャで写真を解放するとあそべるよ 💕';

  // クリア進捗
  const clearedCount = Object.keys(DIFFICULTIES).filter(d => cleared[d]).length;
  document.getElementById('clear-progress').textContent =
    clearedCount > 0 ? `${clearedCount} / ${Object.keys(DIFFICULTIES).length} 難易度クリア` : '';

  // 全クリアプレゼント
  const pBtn = document.getElementById('present-view-btn');
  if (isAllCleared()) {
    pBtn.classList.remove('hidden');
    const received = getOpened().find(p => p.date === PUZZLE_PRESENT.date);
    pBtn.textContent = received ? '🎁 受け取り済み' : '🎁 プレゼントを受け取る';
    pBtn.disabled    = !!received;
    pBtn.style.opacity   = received ? '0.45' : '';
    pBtn.style.animation = received ? 'none' : '';
    pBtn.style.cursor    = received ? 'default' : '';
  } else {
    pBtn.classList.add('hidden');
  }

  // はじめるボタン
  const selIsOpen = isDiffUnlocked(currentDiff);
  document.getElementById('btn-start').disabled = !hasPhoto || !selIsOpen;

  // 選択が locked なら最初の解放済みを選ぶ
  if (!selIsOpen) {
    const first = Object.keys(DIFFICULTIES).find(d => isDiffUnlocked(d));
    if (first) selectDiff(first);
  }
}

function selectDiff(diff) {
  if (!isDiffUnlocked(diff)) return;
  currentDiff = diff;
  document.querySelectorAll('.diff-btn').forEach(b => {
    b.classList.toggle('selected', b.dataset.diff === diff && !b.classList.contains('locked'));
  });
}

document.querySelectorAll('.diff-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    if (btn.classList.contains('locked')) return;
    selectDiff(btn.dataset.diff);
    updateStartScreen();
  });
});

/* =============================================
  ボードサイズ計算
============================================= */
function calcBoardSize() {
  const area   = document.getElementById('game-area');
  const availW = area.clientWidth  - 32;
  const availH = area.clientHeight - 20;
  return Math.min(availW, availH, 420);
}

/* =============================================
  パズル初期化
============================================= */
function initBoard() {
  const cfg = DIFFICULTIES[currentDiff];
  gridSize   = cfg.grid;
  timeLimit  = cfg.time;
  boardSize  = calcBoardSize();
  tileSize   = Math.floor(boardSize / gridSize);
  boardSize  = tileSize * gridSize;

  const board = document.getElementById('puzzle-board');
  board.style.width  = boardSize + 'px';
  board.style.height = boardSize + 'px';

  // 写真選択
  const photos = getUnlockedPhotos();
  currentPhoto = photos[Math.floor(Math.random() * photos.length)];

  document.getElementById('preview-img').src  = `photos/${currentPhoto}`;
  document.getElementById('complete-img').src  = `photos/${currentPhoto}`;
  document.getElementById('preview-strip').classList.add('show');

  // タイル生成
  const n = gridSize * gridSize;
  tiles = Array.from({length: n}, (_, i) => ({
    id: i, row: Math.floor(i / gridSize), col: i % gridSize
  }));
  tiles = shuffleSolvable(tiles);
  renderTiles(true);
}

/* =============================================
  シャッフル（必ず解ける）
============================================= */
function shuffleSolvable(tls) {
  const dirs   = [{dr:-1,dc:0},{dr:1,dc:0},{dr:0,dc:-1},{dr:0,dc:1}];
  let arr      = [...tls];
  let prevDir  = -1;
  const steps  = gridSize * gridSize * 200;
  for (let s = 0; s < steps; s++) {
    const bi   = arr.findIndex(t => t.id === 0);
    const blank= arr[bi];
    const valid= dirs.filter((d,i) => {
      if (i === (prevDir^1)) return false;
      const nr = blank.row + d.dr, nc = blank.col + d.dc;
      return nr >= 0 && nr < gridSize && nc >= 0 && nc < gridSize;
    });
    const d    = valid[Math.floor(Math.random() * valid.length)];
    prevDir    = dirs.indexOf(d);
    const ti   = arr.findIndex(t => t.row === blank.row+d.dr && t.col === blank.col+d.dc);
    [arr[bi].row, arr[ti].row] = [arr[ti].row, arr[bi].row];
    [arr[bi].col, arr[ti].col] = [arr[ti].col, arr[bi].col];
  }
  return arr;
}

/* =============================================
  タイル描画
  ─ background-image + cover で正方形トリミング ─
============================================= */
function renderTiles(isInit = false) {
  const board    = document.getElementById('puzzle-board');
  board.innerHTML = '';

  // background-size: cover 相当の計算
  // → 画像を正方形（boardSize × boardSize）にセンタークロップした上で分割
  // background-size を "boardSizepx boardSizepx" にすると
  // ブラウザが cover と同じく短辺を boardSize に合わせてクロップしてくれる。
  // ただし img の縦横比は不明なので、先にロードして計算する。
  const srcUrl = `photos/${currentPhoto}`;

  function doRender(naturalW, naturalH) {
    // 正方形クロップのための background-size / position 計算
    // 「boardSize × boardSize の正方形に cover」と同じ
    const imgAspect   = naturalW / naturalH;
    const boardAspect = 1; // 正方形

    let bgW, bgH, bgOffsetX, bgOffsetY;

    if (imgAspect > boardAspect) {
      // 横長画像 → 高さを boardSize に合わせ、横にはみ出す
      bgH = boardSize;
      bgW = Math.round(boardSize * imgAspect);
      bgOffsetX = Math.round((bgW - boardSize) / 2);
      bgOffsetY = 0;
    } else {
      // 縦長画像 → 幅を boardSize に合わせ、縦にはみ出す
      bgW = boardSize;
      bgH = Math.round(boardSize / imgAspect);
      bgOffsetX = 0;
      bgOffsetY = Math.round((bgH - boardSize) / 2);
    }

    tiles.forEach((tile, idx) => {
      if (tile.id === 0) return;
      const el = document.createElement('div');
      el.className   = 'tile';
      el.dataset.idx = idx;

      const origRow = Math.floor(tile.id / gridSize);
      const origCol = tile.id % gridSize;

      // このタイルの左上が、元画像のどの位置に相当するか
      const bpX = -(origCol * tileSize + bgOffsetX);  // ← 追加マイナス
      const bpY = -(origRow * tileSize + bgOffsetY);

      // wait: background-position はタイル左上からの offset を正方向で指定
      // background-position: Xpx Ypx → 画像の X,Y ピクセル目がタイル左上に来る
      // なので bpX = origCol*tileSize + bgOffsetX を負にする
      el.style.cssText = [
        `left:${tile.col * tileSize}px`,
        `top:${tile.row * tileSize}px`,
        `width:${tileSize}px`,
        `height:${tileSize}px`,
        `z-index:${idx + 1}`,
        `background-image:url('${srcUrl}')`,
        `background-size:${bgW}px ${bgH}px`,
        `background-position:${-(origCol * tileSize + bgOffsetX)}px ${-(origRow * tileSize + bgOffsetY)}px`,
        `background-repeat:no-repeat`,
      ].join(';');

      if (isInit) {
        el.classList.add('shuffle-in');
        el.style.animationDelay = (idx * 0.02) + 's';
      }
      el.addEventListener('click', () => onTileClick(tile.id));
      el.addEventListener('touchstart', e => { e.preventDefault(); onTileClick(tile.id); }, { passive: false });
      board.appendChild(el);
    });
  }

  // 画像の自然サイズを取得してからレンダリング
  const probe = new Image();
  probe.onload = () => doRender(probe.naturalWidth, probe.naturalHeight);
  probe.onerror = () => doRender(1, 1); // フォールバック（正方形扱い）
  probe.src = srcUrl;
}

/* =============================================
  タイルクリック
============================================= */
function onTileClick(tileId) {
  if (isLocked) return;
  const tIdx  = tiles.findIndex(t => t.id === tileId);
  const bIdx  = tiles.findIndex(t => t.id === 0);
  const tile  = tiles[tIdx], blank = tiles[bIdx];
  if (Math.abs(tile.row - blank.row) + Math.abs(tile.col - blank.col) !== 1) return;

  isLocked = true;
  const el = document.querySelector(`.tile[data-idx="${tIdx}"]`);
  if (el) {
    el.classList.add('sliding');
    el.style.left = (blank.col * tileSize) + 'px';
    el.style.top  = (blank.row * tileSize) + 'px';
  }
  [tiles[tIdx].row, tiles[bIdx].row] = [tiles[bIdx].row, tiles[tIdx].row];
  [tiles[tIdx].col, tiles[bIdx].col] = [tiles[bIdx].col, tiles[tIdx].col];

  moves++;
  updateHUD();

  setTimeout(() => {
    if (el) { el.classList.remove('sliding'); spawnSparkles(el, 5); }
    isLocked = false;
    if (isSolved()) triggerClear();
  }, 220);
}

/* =============================================
  クリア判定
============================================= */
function isSolved() {
  return tiles.every(t => t.row === Math.floor(t.id/gridSize) && t.col === t.id%gridSize);
}

/* =============================================
  タイマー
============================================= */
function startTimer() {
  timeLeft = timeLimit; halfWarnTriggered = false;
  updateTimerDisplay();
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    timeLeft--;
    updateTimerDisplay();
    if (!halfWarnTriggered && timeLeft <= Math.floor(timeLimit / 3)) {
      halfWarnTriggered = true;
      triggerWarnEffect();
    }
    if (timeLeft <= 0) { clearInterval(timerInterval); triggerTimeUp(); }
  }, 1000);
}
function stopTimer() { clearInterval(timerInterval); }

function updateTimerDisplay() {
  const el  = document.getElementById('hud-timer');
  const bar = document.getElementById('timer-bar');
  const isWarn = timeLeft <= Math.floor(timeLimit / 3);
  el.textContent = fmtTime(timeLeft);
  el.classList.toggle('warn', isWarn);
  bar.style.width = `${(timeLeft / timeLimit) * 100}%`;
  bar.classList.toggle('warn', isWarn);
}

function triggerWarnEffect() {
  const wrap    = document.getElementById('game-wrap');
  const timerEl = document.getElementById('hud-timer');
  const flash   = document.getElementById('flash-overlay');

  wrap.classList.add('halfwarn');
  wrap.classList.remove('screen-shake');
  requestAnimationFrame(() => wrap.classList.add('screen-shake'));
  wrap.addEventListener('animationend', () => wrap.classList.remove('screen-shake'), {once:true});

  timerEl.classList.remove('timer-bounce');
  requestAnimationFrame(() => timerEl.classList.add('timer-bounce'));
  timerEl.addEventListener('animationend', () => timerEl.classList.remove('timer-bounce'), {once:true});

  flash.classList.remove('active');
  requestAnimationFrame(() => flash.classList.add('active'));
  flash.addEventListener('animationend', () => flash.classList.remove('active'), {once:true});

  // 「急いで！」メッセージ
  if (!document.getElementById('_warnStyle')) {
    const s = document.createElement('style');
    s.id = '_warnStyle';
    s.textContent = '@keyframes halfwarnMsg{0%{opacity:0;transform:translate(-50%,-50%) scale(0.4);}25%{opacity:1;transform:translate(-50%,-50%) scale(1.15);}55%{opacity:1;transform:translate(-50%,-50%) scale(1);}100%{opacity:0;transform:translate(-50%,-50%) scale(1.25);}}';
    document.head.appendChild(s);
  }
  const msg = document.createElement('div');
  msg.style.cssText = `position:fixed;top:50%;left:50%;font-family:'Zen Kurenaido',cursive;font-size:clamp(22px,6vw,34px);color:#fb7185;text-shadow:0 0 24px rgba(251,113,133,0.9),0 0 48px rgba(251,113,133,0.5);pointer-events:none;z-index:100;animation:halfwarnMsg 1.4s ease-out forwards;letter-spacing:4px;white-space:nowrap;`;
  msg.textContent = '⚡ 急いで！ ⚡';
  document.body.appendChild(msg);
  msg.addEventListener('animationend', () => msg.remove());
}

function updateHUD() { document.getElementById('hud-moves').textContent = `👆 ${moves}手`; }

/* =============================================
  ゲーム開始
============================================= */
function startGame(diff) {
  currentDiff = diff || currentDiff;
  moves = 0; isLocked = false;
  updateHUD();
  document.getElementById('game-wrap').classList.remove('halfwarn','screen-shake');
  document.getElementById('flash-overlay').classList.remove('active');
  document.getElementById('timer-bar').classList.remove('warn');
  document.getElementById('complete-reveal').classList.remove('show');
  ['overlay-start','overlay-clear','overlay-timeup','overlay-giveup'].forEach(id =>
    document.getElementById(id).classList.add('hidden')
  );
  document.getElementById('present-overlay').style.display = 'none';
  stopPresentBg();
  document.getElementById('giveup-btn').classList.add('show');
  initBoard();
  startTimer();
}

/* =============================================
  クリア演出
============================================= */
function triggerClear() {
  stopTimer(); isLocked = true;
  document.getElementById('giveup-btn').classList.remove('show');

  // タイル順番グロー
  const allTiles = document.querySelectorAll('.tile');
  const areaRect = document.getElementById('game-area').getBoundingClientRect();
  allTiles.forEach((el, i) => {
    setTimeout(() => {
      el.classList.add('matched-glow');
      spawnSparkles(el, 4);
    }, i * 55);
  });

  // 次難易度を解放
  const newlyUnlocked = tryUnlockNext(currentDiff);

  // ベスト更新
  const score = { moves, timeLeft };
  const best  = getBest(currentDiff);
  const isNew = !best || moves < best.moves || (moves === best.moves && timeLeft > best.timeLeft);
  if (isNew) setBest(currentDiff, score);
  const prevAll = isAllCleared();
  markCleared(currentDiff);
  const nowAll = isAllCleared();

  const totalDelay = allTiles.length * 55 + 300;
  setTimeout(() => {
    const reveal = document.getElementById('complete-reveal');
    reveal.classList.add('show');
    launchConfetti(80);
    setTimeout(() => launchConfetti(60), 700);
    setTimeout(() => {
      reveal.classList.remove('show');
      showClearOverlay(score, isNew, newlyUnlocked, nowAll && !prevAll);
    }, 2200);
  }, totalDelay);
}

function showClearOverlay(score, isNew, newlyUnlocked, firstAllClear) {
  document.getElementById('cl-score').textContent = `${score.moves}手 / 残り${fmtTime(score.timeLeft)}`;
  document.getElementById('cl-best').textContent  = `ベスト：${bestStr(getBest(currentDiff))}`;

  isNew
    ? document.getElementById('cl-new-record').classList.remove('hidden')
    : document.getElementById('cl-new-record').classList.add('hidden');

  // 難易度解放メッセージ
  const unlockEl = document.getElementById('cl-unlock-msg');
  if (newlyUnlocked.length > 0) {
    const names = newlyUnlocked.map(d => DIFFICULTIES[d].label).join('、');
    unlockEl.textContent = `🔓 「${names}」が解放されました！`;
    unlockEl.classList.remove('hidden');
  } else {
    unlockEl.classList.add('hidden');
  }

  // 全クリアメッセージ
  firstAllClear
    ? document.getElementById('cl-allclear-msg').classList.remove('hidden')
    : document.getElementById('cl-allclear-msg').classList.add('hidden');

  launchConfetti(50);
  document.getElementById('overlay-clear').classList.remove('hidden');

  // 解放ボタンにアニメ（戻った時用）
  newlyUnlocked.forEach(d => {
    setTimeout(() => {
      const btn = document.querySelector(`.diff-btn[data-diff="${d}"]`);
      if (btn) { btn.classList.add('unlocking'); btn.addEventListener('animationend', () => btn.classList.remove('unlocking'), {once:true}); }
    }, 300);
  });
}

/* =============================================
  タイムアップ / ギブアップ
============================================= */
function triggerTimeUp() {
  isLocked = true;
  document.getElementById('giveup-btn').classList.remove('show');
  const matched = tiles.filter(t => t.row === Math.floor(t.id/gridSize) && t.col === t.id%gridSize && t.id !== 0).length;
  document.getElementById('tu-score').textContent = `${matched} / ${gridSize*gridSize-1} ピース完成`;
  document.getElementById('overlay-timeup').classList.remove('hidden');
}

function triggerGiveup() {
  if (!confirm('ギブアップしますか？')) return;
  stopTimer(); isLocked = true;
  document.getElementById('giveup-btn').classList.remove('show');
  const matched = tiles.filter(t => t.row === Math.floor(t.id/gridSize) && t.col === t.id%gridSize && t.id !== 0).length;
  document.getElementById('gu-score').textContent = `${matched} / ${gridSize*gridSize-1} ピース完成`;
  document.getElementById('overlay-giveup').classList.remove('hidden');
}

function goToStart() {
  stopTimer(); isLocked = false;
  document.getElementById('giveup-btn').classList.remove('show');
  document.getElementById('game-wrap').classList.remove('halfwarn');
  document.getElementById('complete-reveal').classList.remove('show');
  document.getElementById('puzzle-board').innerHTML = '';
  document.getElementById('preview-strip').classList.remove('show');
  ['overlay-clear','overlay-timeup','overlay-giveup'].forEach(id =>
    document.getElementById(id).classList.add('hidden')
  );
  document.getElementById('overlay-start').classList.remove('hidden');
  updateStartScreen();
}

/* =============================================
  スパークル / コンフェッティ
============================================= */
function spawnSparkles(el, count) {
  const rect   = el.getBoundingClientRect();
  const cx     = rect.left + rect.width / 2;
  const cy     = rect.top  + rect.height / 2;
  const colors = ['#f472b6','#fba8d0','#f0cc78','#fce7f3','#fb7185'];
  for (let i = 0; i < count; i++) {
    const sp  = document.createElement('div');
    sp.className = 'sparkle-piece';
    const size  = 3 + Math.random() * 5;
    const angle = Math.random() * Math.PI * 2;
    const dist  = 25 + Math.random() * 50;
    const dur   = 0.4 + Math.random() * 0.4;
    sp.style.cssText = `left:${cx}px;top:${cy}px;width:${size}px;height:${size}px;background:${colors[~~(Math.random()*colors.length)]};--tx:${Math.cos(angle)*dist}px;--ty:${Math.sin(angle)*dist}px;--dur:${dur}s;`;
    document.body.appendChild(sp);
    sp.addEventListener('animationend', () => sp.remove());
  }
}

function launchConfetti(count = 80) {
  const colors = ['#f472b6','#fba8d0','#fce7f3','#fb7185','#ffffff','#f0cc78','#fbcfe8'];
  for (let i = 0; i < count; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    const sz = 6 + Math.random() * 9;
    el.style.cssText = `left:${Math.random()*100}vw;width:${sz}px;height:${sz}px;background:${colors[~~(Math.random()*colors.length)]};border-radius:${Math.random()<0.6?'50%':'2px'};animation-duration:${2.4+Math.random()*2}s;animation-delay:${Math.random()*.7}s;`;
    document.body.appendChild(el);
    el.addEventListener('animationend', () => el.remove());
  }
}

/* =============================================
  プレゼントボックス
============================================= */
let presentBgRaf = null;
function startPresentBg() {
  const canvas = document.getElementById('present-bg-canvas'), cx = canvas.getContext('2d');
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  let pts = [], t = 0;
  function burst() {
    const bx=Math.random()*canvas.width, by=Math.random()*canvas.height*0.65;
    const cols=['#f472b6','#fba8d0','#f0cc78','#fce7f3','#fb7185','#d4a84c'];
    for(let i=0;i<22;i++){const a=Math.random()*Math.PI*2,sp=1.5+Math.random()*4;pts.push({x:bx,y:by,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2.5,color:cols[~~(Math.random()*cols.length)],life:1,size:3+Math.random()*5});}
  }
  function frame() {
    cx.clearRect(0,0,canvas.width,canvas.height);
    t++; if(t%35===0)burst();
    for(let i=pts.length-1;i>=0;i--){const p=pts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.1;p.life-=0.016;if(p.life<=0){pts.splice(i,1);continue;}cx.globalAlpha=p.life;cx.fillStyle=p.color;cx.beginPath();cx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2);cx.fill();}
    cx.globalAlpha=1;
    presentBgRaf=requestAnimationFrame(frame);
  }
  frame();
}
function stopPresentBg() { cancelAnimationFrame(presentBgRaf); }

function showPresentOverlay(pData) {
  const overlay  = document.getElementById('present-overlay');
  const phBox    = document.getElementById('present-phase-box');
  const phReveal = document.getElementById('present-phase-reveal');
  const box      = document.getElementById('present-box-svg');
  phBox.style.display = 'flex'; phReveal.style.display = 'none';
  box.className = ''; overlay.style.display = 'flex';

  let si = setInterval(() => { box.classList.add('box-shaking'); setTimeout(()=>box.classList.remove('box-shaking'),500); }, 2200);
  function openBox() {
    clearInterval(si);
    document.getElementById('present-box-wrap').removeEventListener('click', openBox);
    box.classList.add('box-bursting');
    launchConfetti(130); startPresentBg();
    setTimeout(() => {
      phBox.style.display = 'none';
      document.getElementById('present-reveal-title').textContent = pData.title || 'プレゼント 🎁';
      document.getElementById('present-reveal-msg').textContent   = pData.message || '';
      const iw = document.getElementById('present-reveal-img-wrap');
      const ri = document.getElementById('present-reveal-img');
      if (pData.image) { iw.style.display='block'; ri.src='photos/'+pData.image; } else { iw.style.display='none'; }
      phReveal.style.display = 'flex'; phReveal.classList.add('show');
      const opened = getOpened();
      if (!opened.find(p => p.date === pData.date)) { opened.push({date:pData.date,title:pData.title||'プレゼント',message:pData.message||'',image:pData.image||''}); setOpened(opened); }
      setTimeout(()=>launchConfetti(80),700); setTimeout(()=>launchConfetti(60),1500);
    }, 700);
  }
  document.getElementById('present-box-wrap').addEventListener('click', openBox);
}

document.getElementById('present-reveal-close').addEventListener('click', () => {
  stopPresentBg();
  document.getElementById('present-overlay').style.display = 'none';
  document.getElementById('overlay-start').classList.remove('hidden');
  updateStartScreen();
});

/* =============================================
  プレビュー画像タップ
============================================= */
document.getElementById('preview-img').addEventListener('click', () => {
  const r = document.getElementById('complete-reveal');
  r.classList.contains('show') ? r.classList.remove('show') : r.classList.add('show');
});
document.getElementById('complete-reveal').addEventListener('click', e => {
  if (e.target === document.getElementById('complete-reveal'))
    document.getElementById('complete-reveal').classList.remove('show');
});

/* =============================================
  イベント
============================================= */
document.getElementById('btn-start').addEventListener('click',       () => startGame(currentDiff));
document.getElementById('btn-retry').addEventListener('click',       () => startGame(currentDiff));
document.getElementById('btn-retry-tu').addEventListener('click',    () => startGame(currentDiff));
document.getElementById('btn-retry-gu').addEventListener('click',    () => startGame(currentDiff));
document.getElementById('btn-to-start-clear').addEventListener('click', goToStart);
document.getElementById('btn-to-start-tu').addEventListener('click',    goToStart);
document.getElementById('btn-to-start-gu').addEventListener('click',    goToStart);
document.getElementById('giveup-btn').addEventListener('click',         triggerGiveup);
document.getElementById('present-view-btn').addEventListener('click',   () => {
  if (getOpened().find(p => p.date === PUZZLE_PRESENT.date)) return;
  document.getElementById('overlay-start').classList.add('hidden');
  showPresentOverlay(PUZZLE_PRESENT);
});

/* =============================================
  🔧 デバッグメニュー
============================================= */
let debugTapCount = 0, debugTapTimer = null;
const debugHint = document.getElementById('debug-hint');
document.getElementById('cl-score').addEventListener('click', () => {
  debugTapCount++;
  clearTimeout(debugTapTimer);
  debugTapTimer = setTimeout(() => { debugTapCount = 0; debugHint.textContent = ''; }, 2000);
  debugHint.textContent = ['・','・・','・・・','・・・・','debug'][Math.min(debugTapCount-1,4)] || '';
  if (debugTapCount >= 5) { debugTapCount = 0; clearTimeout(debugTapTimer); openDebugMenu(); }
});

function openDebugMenu() {
  debugHint.textContent = '';
  document.getElementById('debug-overlay')?.remove();
  const panel = document.createElement('div');
  panel.id = 'debug-overlay';
  panel.style.cssText = 'position:fixed;inset:0;z-index:200;background:rgba(5,1,8,0.96);backdrop-filter:blur(14px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:32px 24px;';
  const mk = (lbl,col,bg) => { const b=document.createElement('button'); b.style.cssText=`width:240px;padding:13px 20px;border-radius:10px;background:${bg};border:1px solid ${col};color:${col};font-family:'Zen Kurenaido',cursive;font-size:14px;letter-spacing:1px;cursor:pointer;`; b.textContent=lbl; return b; };

  const t = document.createElement('div');
  t.style.cssText = "font-family:'Zen Kurenaido',cursive;font-size:18px;color:var(--cream);letter-spacing:2px;";
  t.textContent = '🔧 デバッグメニュー'; panel.appendChild(t);

  const bClear = mk('🎉 クリア演出を表示','#e879a0','rgba(232,121,160,0.2)');
  bClear.onclick = () => { panel.remove(); document.getElementById('overlay-clear').classList.add('hidden'); triggerClear(); };
  panel.appendChild(bClear);

  const bPresent = mk('🎁 プレゼント画面を表示','#f0cc78','rgba(212,168,76,0.15)');
  bPresent.onclick = () => { panel.remove(); showPresentOverlay(PUZZLE_PRESENT); };
  panel.appendChild(bPresent);

  const bUnlock = mk('🔓 全難易度を解放','#a78bfa','rgba(124,58,237,0.15)');
  bUnlock.onclick = () => { setUnlocked({easy:true,normal:true,hard:true}); panel.remove(); updateStartScreen(); };
  panel.appendChild(bUnlock);

  const bReset = mk('🗑 全データをリセット','#fba8d0','rgba(244,114,182,0.12)');
  bReset.onclick = () => {
    ['easy','normal','hard'].forEach(d => localStorage.removeItem(BEST_KEY_PREFIX+d));
    localStorage.removeItem(CLEARED_KEY); localStorage.removeItem(UNLOCKED_KEY);
    panel.remove(); updateStartScreen();
  };
  panel.appendChild(bReset);

  const bClose = document.createElement('button');
  bClose.style.cssText = "margin-top:8px;background:none;border:1px solid rgba(244,114,182,0.25);border-radius:999px;color:var(--dim);padding:10px 32px;font-family:'Zen Kurenaido',cursive;font-size:13px;letter-spacing:2px;cursor:pointer;";
  bClose.textContent = 'とじる'; bClose.onclick = () => panel.remove();
  panel.appendChild(bClose);
  document.body.appendChild(panel);
}

/* ===== 初期化 ===== */
updateStartScreen();
</script>
