<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>夏希との思い出カウントダウンガチャ 🎀</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;600&family=Cormorant+Garamond:ital,wght@0,300;1,400&family=Zen+Kurenaido&display=swap" rel="stylesheet">
<style>
/* =============================================
   ROOT VARIABLES
============================================= */
:root {
  --bg:        #1a0a14;
  --bg2:       #240d1a;
  --pink:      #f472b6;
  --pink-l:    #fba8d0;
  --pink-ll:   #fce7f3;
  --pink-d:    #c0527a;
  --rose:      #fb7185;
  --gold:      #d4a84c;
  --gold-l:    #f0cc78;
  --cream:     #fdf0f5;
  --text:      #fce7f3;
  --dim:       rgba(252,231,243,0.45);
  --border:    rgba(244,114,182,0.22);
  --panel:     rgba(244,114,182,0.07);
  --glow:      rgba(244,114,182,0.35);
}

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; }

body {
  font-family: 'Noto Serif JP', serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* =============================================
   CANVAS BACKGROUND
============================================= */
#bg-canvas {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
}

/* =============================================
   PAGE WRAPPER
============================================= */
#page {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 56px 24px 100px;
}

/* =============================================
   HEADER
============================================= */
.site-header {
  text-align: center;
  margin-bottom: 48px;
  animation: fadeDown 1s ease both;
}
.header-badge {
  display: inline-block;
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 12px;
  letter-spacing: 4px;
  color: var(--pink-l);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 5px 18px;
  margin-bottom: 20px;
  background: var(--panel);
}
.site-header h1 {
  font-family: 'Zen Kurenaido', cursive;
  font-size: clamp(22px, 5.5vw, 38px);
  color: var(--cream);
  line-height: 1.5;
  text-shadow:
    0 0 40px rgba(244,114,182,0.5),
    0 0 80px rgba(244,114,182,0.2);
  margin-bottom: 10px;
}
.site-header h1 .name {
  color: var(--pink-l);
  font-size: 1.15em;
}
.header-deco {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin-top: 14px;
  opacity: 0.65;
}
.header-deco::before,
.header-deco::after {
  content: '';
  width: 60px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--pink));
}
.header-deco span {
  font-size: 14px;
  color: var(--pink-l);
  letter-spacing: 2px;
}

@keyframes fadeDown {
  from { opacity:0; transform:translateY(-20px); }
  to   { opacity:1; transform:translateY(0); }
}

/* =============================================
   COUNTDOWN
============================================= */
#countdown-wrap {
  margin-bottom: 56px;
  animation: fadeDown 1s 0.15s ease both;
}
.cd-label-top {
  text-align: center;
  font-family: 'Zen Kurenaido', cursive;
  font-size: 13px;
  letter-spacing: 3px;
  color: var(--pink-l);
  margin-bottom: 16px;
  opacity: 0.8;
}
.cd-row {
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
}
.cd-block {
  position: relative;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 18px 22px 14px;
  min-width: 78px;
  text-align: center;
  backdrop-filter: blur(10px);
  overflow: hidden;
}
.cd-block::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--pink-l), transparent);
}
.cd-block::after {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 50% 0%, rgba(244,114,182,0.12), transparent 70%);
  pointer-events: none;
}
.cd-num {
  display: block;
  font-family: 'Cormorant Garamond', serif;
  font-size: 44px;
  font-weight: 300;
  color: var(--pink-l);
  line-height: 1;
  text-shadow: 0 0 20px var(--glow);
}
.cd-unit {
  display: block;
  font-size: 10px;
  letter-spacing: 2.5px;
  color: var(--dim);
  margin-top: 5px;
}
#birthday-banner {
  display: none;
  text-align: center;
  margin-bottom: 56px;
}
#birthday-banner p {
  font-family: 'Zen Kurenaido', cursive;
  font-size: clamp(20px, 5vw, 34px);
  color: var(--pink-l);
  animation: bdGlow 1.8s ease-in-out infinite alternate;
  line-height: 1.6;
}
@keyframes bdGlow {
  from { text-shadow: 0 0 12px rgba(251,168,208,0.4); }
  to   { text-shadow: 0 0 40px rgba(251,168,208,1), 0 0 80px rgba(251,168,208,0.4); }
}

/* =============================================
   GACHA ZONE
============================================= */
#gacha-zone {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 28px;
  width: 100%;
  max-width: 440px;
  margin-bottom: 72px;
  animation: fadeDown 1s 0.3s ease both;
}

/* カプセル */
#capsule-svg {
  width: 130px;
  height: 130px;
  filter:
    drop-shadow(0 0 18px rgba(212,168,76,0.55))
    drop-shadow(0 0 40px rgba(212,168,76,0.2));
  transition: filter 0.3s;
}
#capsule-svg.spinning { animation: spin 0.5s linear infinite; }
#capsule-svg.burst    { animation: burst 0.45s cubic-bezier(0.36,0.07,0.19,0.97) forwards; }
@keyframes spin  { to { transform: rotate(360deg); } }
@keyframes burst {
  0%   { transform: scale(1) rotate(0deg);    opacity: 1; }
  55%  { transform: scale(1.4) rotate(18deg); opacity: 0.7; }
  100% { transform: scale(0) rotate(-25deg);  opacity: 0; }
}

/* ガチャボタン */
#gacha-btn {
  position: relative;
  font-family: 'Zen Kurenaido', cursive;
  font-size: 17px;
  letter-spacing: 3px;
  color: #fff;
  background: linear-gradient(135deg, #e879a0 0%, #f9a8d4 40%, #e879a0 100%);
  border: none;
  border-radius: 999px;
  padding: 18px 58px;
  cursor: pointer;
  box-shadow:
    0 4px 24px rgba(232,121,160,0.5),
    0 0 0 1px rgba(255,255,255,0.15) inset,
    0 1px 0 rgba(255,255,255,0.4) inset;
  transition: transform 0.15s, box-shadow 0.15s;
  overflow: hidden;
}
#gacha-btn::after {
  content: '';
  position: absolute;
  top: -60%; left: -60%;
  width: 220%; height: 220%;
  background: linear-gradient(115deg, transparent 35%, rgba(255,255,255,0.45) 50%, transparent 65%);
  animation: btnShine 3s linear infinite;
}
@keyframes btnShine {
  from { transform: translateX(-100%) rotate(20deg); }
  to   { transform: translateX(100%) rotate(20deg); }
}
#gacha-btn:hover:not(:disabled) {
  transform: translateY(-3px);
  box-shadow: 0 10px 36px rgba(232,121,160,0.7), 0 0 0 1px rgba(255,255,255,0.2) inset;
}
#gacha-btn:active:not(:disabled) { transform: translateY(0); }
#gacha-btn:disabled {
  background: rgba(255,255,255,0.07);
  color: var(--dim);
  box-shadow: none;
  cursor: default;
}
#gacha-btn:disabled::after { display:none; }

#status-msg {
  font-size: 13px;
  color: var(--dim);
  letter-spacing: 1px;
  text-align: center;
  line-height: 2;
  min-height: 28px;
}

/* =============================================
   POLAROID
============================================= */
#photo-stage {
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  width: 100%;
  max-width: 320px;
}
#photo-stage.show {
  display: flex;
  animation: polaroidIn 0.75s cubic-bezier(0.22,1,0.36,1) forwards;
}
@keyframes polaroidIn {
  from { opacity:0; transform: translateY(44px) rotate(-4deg) scale(0.88); }
  to   { opacity:1; transform: translateY(0) rotate(-1.5deg) scale(1); }
}
.polaroid-card {
  background: #fff;
  padding: 14px 14px 52px;
  box-shadow:
    0 3px 10px rgba(0,0,0,0.3),
    0 16px 48px rgba(0,0,0,0.45),
    0 0 0 1px rgba(255,255,255,0.05);
  width: 100%;
  position: relative;
}
.polaroid-card img {
  width: 100%;
  aspect-ratio: 4/3;
  object-fit: cover;
  display: block;
}
.polaroid-demo {
  width: 100%;
  aspect-ratio: 4/3;
  background: linear-gradient(135deg, #fce7f3, #fbcfe8, #f9a8d4);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 10px;
}
.polaroid-demo span:first-child { font-size: 48px; }
.polaroid-demo span:last-child  { font-family:'Zen Kurenaido',cursive; font-size:13px; color:#b06090; letter-spacing:1px; }
.polaroid-label {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.polaroid-heart {
  font-size: 20px;
  animation: heartbeat 1.4s ease-in-out infinite;
}
@keyframes heartbeat {
  0%,100% { transform: scale(1); }
  50%      { transform: scale(1.25); }
}
.photo-meta {
  font-size: 12px;
  color: var(--dim);
  letter-spacing: 2px;
  text-align: center;
}

/* =============================================
   SECTION DIVIDER
============================================= */
.section-divider {
  width: 100%;
  max-width: 500px;
  display: flex;
  align-items: center;
  gap: 16px;
  margin: 0 0 44px;
}
.section-divider::before,
.section-divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--pink), transparent);
  opacity: 0.5;
}
.section-divider span {
  font-family: 'Zen Kurenaido', cursive;
  font-size: 14px;
  letter-spacing: 3px;
  color: var(--pink-l);
  white-space: nowrap;
}

/* =============================================
   COLLECTION GRID
============================================= */
#collection-section {
  width: 100%;
  max-width: 660px;
  margin-bottom: 80px;
}
#collection-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: 10px;
}
.col-item {
  aspect-ratio: 1;
  border-radius: 10px;
  overflow: hidden;
  position: relative;
  border: 1px solid var(--border);
  cursor: pointer;
  transition: transform 0.25s, box-shadow 0.25s;
}
.col-item.unlocked:hover {
  transform: translateY(-4px) scale(1.03);
  box-shadow: 0 12px 32px rgba(244,114,182,0.35);
  border-color: var(--pink);
}
.col-item.unlocked img {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
  opacity: 0.9;
  transition: opacity 0.2s;
}
.col-item.unlocked:hover img { opacity: 1; }
.col-item.unlocked .col-demo {
  width: 100%; height: 100%;
  background: linear-gradient(135deg, #fce7f3, #f9a8d4);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
}
.col-item.unlocked .col-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(transparent 55%, rgba(180,60,100,0.55));
  opacity: 0;
  transition: opacity 0.25s;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding-bottom: 8px;
}
.col-item.unlocked:hover .col-overlay { opacity: 1; }
.col-overlay-text {
  font-family: 'Zen Kurenaido', cursive;
  font-size: 11px;
  color: white;
  letter-spacing: 1px;
}
.col-item.locked {
  background: rgba(244,114,182,0.04);
  border-style: dashed;
  border-color: rgba(244,114,182,0.12);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: default;
}
.col-item.locked .lock-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}
.col-item.locked .lock-icon { font-size: 18px; opacity: 0.18; }
.col-item.locked .lock-num  { font-size: 9px; color: var(--dim); opacity: 0.5; letter-spacing: 0.5px; }

/* =============================================
   LIGHTBOX
============================================= */
#lightbox {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 200;
  background: rgba(20,4,14,0.92);
  backdrop-filter: blur(12px);
  align-items: center;
  justify-content: center;
  padding: 32px 20px;
  animation: lbIn 0.3s ease;
}
#lightbox.open { display: flex; }
@keyframes lbIn {
  from { opacity:0; }
  to   { opacity:1; }
}
#lightbox-inner {
  position: relative;
  max-width: min(520px, 92vw);
  width: 100%;
  animation: lbSlide 0.35s cubic-bezier(0.22,1,0.36,1);
}
@keyframes lbSlide {
  from { transform: scale(0.88) translateY(24px); opacity:0; }
  to   { transform: scale(1) translateY(0);        opacity:1; }
}
.lb-polaroid {
  background: #fff;
  padding: 16px 16px 64px;
  box-shadow: 0 24px 80px rgba(0,0,0,0.7);
  width: 100%;
}
.lb-polaroid img {
  width: 100%;
  aspect-ratio: 4/3;
  object-fit: cover;
  display: block;
}
.lb-demo {
  width: 100%;
  aspect-ratio: 4/3;
  background: linear-gradient(135deg, #fce7f3, #fbcfe8, #f9a8d4);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 64px;
}
.lb-bottom {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
}
.lb-heart { font-size: 22px; animation: heartbeat 1.4s ease-in-out infinite; }
.lb-close {
  position: absolute;
  top: -48px; right: 0;
  background: none;
  border: 1px solid rgba(244,114,182,0.35);
  border-radius: 50%;
  width: 38px; height: 38px;
  color: var(--pink-l);
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.2s;
}
.lb-close:hover { background: rgba(244,114,182,0.12); }
.lb-nav {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: rgba(244,114,182,0.12);
  border: 1px solid rgba(244,114,182,0.3);
  border-radius: 50%;
  width: 42px; height: 42px;
  color: var(--pink-l);
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.2s;
}
.lb-nav:hover { background: rgba(244,114,182,0.25); }
#lb-prev { left: -56px; }
#lb-next { right: -56px; }

/* =============================================
   CONFETTI
============================================= */
.confetti-piece {
  position: fixed;
  top: -14px;
  pointer-events: none;
  z-index: 999;
  animation: confettiFall linear forwards;
}
@keyframes confettiFall {
  0%   { transform: translateY(0) rotate(0deg); opacity:1; }
  80%  { opacity:1; }
  100% { transform: translateY(108vh) rotate(900deg); opacity:0; }
}

/* =============================================
   FOOTER
============================================= */
footer {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 13px;
  color: var(--dim);
  letter-spacing: 2px;
  text-align: center;
  margin-top: 20px;
}

/* =============================================
   RESPONSIVE
============================================= */
@media (max-width: 420px) {
  .cd-block { min-width: 64px; padding:14px 14px 12px; }
  .cd-num   { font-size: 34px; }
  #collection-grid { grid-template-columns: repeat(3,1fr); gap: 8px; }
  #lb-prev { left: -10px; top: auto; bottom: -56px; }
  #lb-next { right: -10px; top: auto; bottom: -56px; }
}
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div id="page">

  <!-- ===== HEADER ===== -->
  <header class="site-header">
    <div class="header-badge">✦ birthday countdown ✦</div>
    <h1>
      <span class="name">夏希</span>との<br>
      思い出カウントダウンガチャ
    </h1>
    <div class="header-deco"><span>🎀</span></div>
  </header>

  <!-- ===== COUNTDOWN ===== -->
  <div id="countdown-wrap">
    <p class="cd-label-top">お誕生日まで あと</p>
    <div class="cd-row">
      <div class="cd-block"><span class="cd-num" id="cd-d">--</span><span class="cd-unit">日</span></div>
      <div class="cd-block"><span class="cd-num" id="cd-h">--</span><span class="cd-unit">時間</span></div>
      <div class="cd-block"><span class="cd-num" id="cd-m">--</span><span class="cd-unit">分</span></div>
      <div class="cd-block"><span class="cd-num" id="cd-s">--</span><span class="cd-unit">秒</span></div>
    </div>
  </div>
  <div id="birthday-banner">
    <p>🎂 夏希、お誕生日おめでとう！ 🎂<br>
    <span style="font-size:0.65em;opacity:0.8">大好きだよ 💕</span></p>
  </div>

  <!-- ===== GACHA ZONE ===== -->
  <div id="gacha-zone">

    <!-- 金のカプセル -->
    <svg id="capsule-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="gTop" cx="38%" cy="32%">
          <stop offset="0%"   stop-color="#f8e090"/>
          <stop offset="60%"  stop-color="#d4a840"/>
          <stop offset="100%" stop-color="#a07820"/>
        </radialGradient>
        <radialGradient id="gBot" cx="55%" cy="68%">
          <stop offset="0%"   stop-color="#f5eed8"/>
          <stop offset="100%" stop-color="#c8aa60"/>
        </radialGradient>
        <clipPath id="clipT"><rect x="0" y="0"  width="100" height="50"/></clipPath>
        <clipPath id="clipB"><rect x="0" y="50" width="100" height="50"/></clipPath>
      </defs>
      <ellipse cx="50" cy="97" rx="26" ry="3.5" fill="rgba(0,0,0,0.25)"/>
      <ellipse cx="50" cy="50" rx="33" ry="43" fill="url(#gBot)" clip-path="url(#clipB)"/>
      <ellipse cx="50" cy="50" rx="33" ry="43" fill="url(#gTop)" clip-path="url(#clipT)"/>
      <line x1="17" y1="50" x2="83" y2="50" stroke="rgba(140,100,20,0.5)" stroke-width="1.5"/>
      <ellipse cx="37" cy="26" rx="7" ry="11" fill="white" opacity="0.3" transform="rotate(-18 37 26)"/>
      <ellipse cx="42" cy="20" rx="3" ry="5"  fill="white" opacity="0.18" transform="rotate(-18 42 20)"/>
    </svg>

    <button id="gacha-btn">🎀 ガチャをひく 🎀</button>
    <div id="status-msg"></div>

    <!-- ポラロイド写真 -->
    <div id="photo-stage">
      <div class="polaroid-card">
        <img id="photo-img" src="" alt="思い出の写真" style="display:none">
        <div class="polaroid-demo" id="photo-demo">
          <span>📷</span>
          <span>夏希との思い出</span>
        </div>
        <div class="polaroid-label">
          <span class="polaroid-heart">💕</span>
        </div>
      </div>
      <div class="photo-meta" id="photo-meta"></div>
    </div>

  </div><!-- /gacha-zone -->

  <!-- ===== COLLECTION ===== -->
  <div class="section-divider"><span>🎀 思い出コレクション 🎀</span></div>
  <section id="collection-section">
    <div id="collection-grid"></div>
  </section>

  <footer>made with love for 夏希 💕</footer>

</div><!-- /page -->

<!-- ===== LIGHTBOX ===== -->
<div id="lightbox">
  <div id="lightbox-inner">
    <button class="lb-close" id="lb-close">✕</button>
    <button class="lb-nav" id="lb-prev">‹</button>
    <button class="lb-nav" id="lb-next">›</button>
    <div class="lb-polaroid">
      <img id="lb-img" src="" alt="" style="display:none">
      <div class="lb-demo" id="lb-demo" style="display:none">📷</div>
      <div class="lb-bottom">
        <span class="lb-heart">💕</span>
      </div>
    </div>
  </div>
</div>

<script>
/* =============================================
   CANVAS BACKGROUND — stars + floating hearts
============================================= */
(function BG(){
  const c  = document.getElementById('bg-canvas');
  const cx = c.getContext('2d');
  let W, H, items=[];

  function resize(){
    W = c.width  = window.innerWidth;
    H = c.height = window.innerHeight;
    generate();
  }

  function generate(){
    items = [];
    // 星
    for(let i=0;i<160;i++){
      items.push({
        type:'star',
        x: Math.random()*W, y: Math.random()*H,
        r: Math.random()*1.3+0.2,
        a: Math.random(),
        da:(Math.random()*0.25+0.06)*(Math.random()<.5?1:-1)/60,
      });
    }
    // ふわふわハート
    for(let i=0;i<18;i++){
      items.push({
        type:'heart',
        x: Math.random()*W, y: Math.random()*H,
        size: Math.random()*10+6,
        a: Math.random()*0.18+0.04,
        vy:-(Math.random()*0.25+0.08),
        vx:(Math.random()-0.5)*0.15,
        drift: Math.random()*Math.PI*2,
      });
    }
  }

  function drawHeart(x,y,s,alpha){
    cx.save();
    cx.translate(x,y);
    cx.globalAlpha = alpha;
    cx.fillStyle = '#f472b6';
    cx.beginPath();
    cx.moveTo(0,-s*0.35);
    cx.bezierCurveTo( s*.55,-s*.9,  s*1.1, s*.1,   0,  s*.7);
    cx.bezierCurveTo(-s*1.1, s*.1, -s*.55,-s*.9,   0, -s*0.35);
    cx.fill();
    cx.restore();
  }

  function frame(){
    cx.clearRect(0,0,W,H);
    // 背景グラデ
    const gr = cx.createRadialGradient(W*.5,H*.3,0,W*.5,H*.5,H*.8);
    gr.addColorStop(0,'rgba(80,10,50,0.6)');
    gr.addColorStop(1,'rgba(20,4,16,0)');
    cx.fillStyle = gr;
    cx.fillRect(0,0,W,H);

    items.forEach(it=>{
      if(it.type==='star'){
        it.a += it.da;
        if(it.a>1||it.a<0.04) it.da*=-1;
        cx.beginPath();
        cx.arc(it.x,it.y,it.r,0,Math.PI*2);
        cx.fillStyle=`rgba(252,231,243,${it.a.toFixed(2)})`;
        cx.fill();
      } else {
        it.drift += 0.008;
        it.y += it.vy;
        it.x += it.vx + Math.sin(it.drift)*0.12;
        if(it.y < -30){ it.y = H+20; it.x=Math.random()*W; }
        drawHeart(it.x, it.y, it.size, it.a);
      }
    });
    requestAnimationFrame(frame);
  }

  resize();
  frame();
  window.addEventListener('resize',resize);
})();

/* =============================================
   COUNTDOWN
============================================= */
function updateCountdown(){
  const now = new Date();
  const yr  = (now.getMonth()+1>6||(now.getMonth()+1===6&&now.getDate()>=30))
              ? now.getFullYear()+1 : now.getFullYear();
  const target = new Date(yr,5,30,0,0,0);
  const diff   = target - now;

  if(diff<=0){
    document.getElementById('countdown-wrap').style.display='none';
    document.getElementById('birthday-banner').style.display='block';
    return;
  }

  const d=Math.floor(diff/864e5);
  const h=Math.floor((diff%864e5)/36e5);
  const m=Math.floor((diff%36e5)/6e4);
  const s=Math.floor((diff%6e4)/1e3);

  document.getElementById('cd-d').textContent=String(d).padStart(2,'0');
  document.getElementById('cd-h').textContent=String(h).padStart(2,'0');
  document.getElementById('cd-m').textContent=String(m).padStart(2,'0');
  document.getElementById('cd-s').textContent=String(s).padStart(2,'0');
}
updateCountdown();
setInterval(updateCountdown,1000);

/* =============================================
   STORAGE
============================================= */
const KEY_PULLED='bdg_pulled_v2';
const KEY_TODAY ='bdg_today_v2';

const getPulled=()=>{try{return JSON.parse(localStorage.getItem(KEY_PULLED))||[];}catch{return[];}};
const setPulled=a=>localStorage.setItem(KEY_PULLED,JSON.stringify(a));
const getToday =()=>{try{return JSON.parse(localStorage.getItem(KEY_TODAY))||null;}catch{return null;}};
const setToday =o=>localStorage.setItem(KEY_TODAY,JSON.stringify(o));
const todayStr =()=>{const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};

/* =============================================
   PHOTO MAP
============================================= */
let photoMap={};

async function loadPhotos(){
  try{
    const r=await fetch('photos.json?v='+Date.now());
    if(!r.ok) throw 0;
    photoMap=await r.json();
  }catch{
    // デモモード
    photoMap={
      "2025-05-01":"__demo__",
      "2025-05-10":"__demo__",
      "2025-05-18":"__demo__",
      "2025-06-01":"__demo__",
      "2025-06-15":"__demo__",
      "2025-06-20":"__demo__",
    };
  }
}

function pickRandom(){
  const keys=Object.keys(photoMap);
  if(!keys.length) return null;
  const pulled=getPulled();
  let pool=keys.filter(k=>!pulled.includes(k));
  if(!pool.length) pool=keys;
  return pool[Math.floor(Math.random()*pool.length)];
}

/* =============================================
   SHOW POLAROID
============================================= */
function showPhoto(dateKey, animate=true){
  const stage=document.getElementById('photo-stage');
  const img  =document.getElementById('photo-img');
  const demo =document.getElementById('photo-demo');
  const meta =document.getElementById('photo-meta');

  const fn=photoMap[dateKey];
  const isDemo=!fn||fn==='__demo__';

  if(isDemo){ img.style.display='none'; demo.style.display='flex'; }
  else       { img.src=`photos/${fn}`; img.style.display='block'; demo.style.display='none'; }

  const keys=Object.keys(photoMap).sort();
  const idx=keys.indexOf(dateKey)+1;
  meta.textContent=`思い出 ${idx} / ${keys.length}`;

  if(animate){
    stage.classList.remove('show');
    requestAnimationFrame(()=>{ stage.classList.add('show'); });
  } else {
    stage.classList.add('show');
  }
}

/* =============================================
   COLLECTION GRID
============================================= */
let unlockedKeys=[]; // for lightbox navigation

function renderCollection(){
  const grid  =document.getElementById('collection-grid');
  const pulled=getPulled();
  const keys  =Object.keys(photoMap).sort();
  unlockedKeys=keys.filter(k=>pulled.includes(k));

  grid.innerHTML='';

  if(!keys.length){
    grid.innerHTML='<p style="text-align:center;color:var(--dim);font-size:13px;grid-column:1/-1;padding:24px 0">写真が登録されていません</p>';
    return;
  }

  keys.forEach((k,i)=>{
    const el=document.createElement('div');
    const isUnlocked=pulled.includes(k);
    el.className='col-item '+(isUnlocked?'unlocked':'locked');

    if(isUnlocked){
      const fn=photoMap[k];
      const isDemo=!fn||fn==='__demo__';

      if(isDemo){
        const d=document.createElement('div');
        d.className='col-demo';
        d.textContent='📷';
        el.appendChild(d);
      } else {
        const img=document.createElement('img');
        img.src=`photos/${fn}`;
        img.alt='思い出';
        el.appendChild(img);
      }

      const ov=document.createElement('div');
      ov.className='col-overlay';
      ov.innerHTML='<span class="col-overlay-text">💕 クリックして大きく見る</span>';
      el.appendChild(ov);

      el.addEventListener('click',()=>openLightbox(k));
    } else {
      const wrap=document.createElement('div');
      wrap.className='lock-wrap';
      wrap.innerHTML=`<div class="lock-icon">🔒</div><div class="lock-num">${i+1}</div>`;
      el.appendChild(wrap);
    }

    grid.appendChild(el);
  });
}

/* =============================================
   LIGHTBOX
============================================= */
let lbCurrentKey=null;

function openLightbox(dateKey){
  lbCurrentKey=dateKey;
  renderLightbox();
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow='hidden';
}

function closeLightbox(){
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow='';
  lbCurrentKey=null;
}

function renderLightbox(){
  const img =document.getElementById('lb-img');
  const demo=document.getElementById('lb-demo');
  const fn  =photoMap[lbCurrentKey];
  const isDemo=!fn||fn==='__demo__';

  if(isDemo){ img.style.display='none'; demo.style.display='flex'; }
  else       { img.src=`photos/${fn}`; img.style.display='block'; demo.style.display='none'; }
}

function lbNavigate(dir){
  if(!lbCurrentKey||!unlockedKeys.length) return;
  const idx=(unlockedKeys.indexOf(lbCurrentKey)+dir+unlockedKeys.length)%unlockedKeys.length;
  lbCurrentKey=unlockedKeys[idx];
  renderLightbox();
}

document.getElementById('lb-close').addEventListener('click',closeLightbox);
document.getElementById('lb-prev').addEventListener('click',()=>lbNavigate(-1));
document.getElementById('lb-next').addEventListener('click',()=>lbNavigate(1));
document.getElementById('lightbox').addEventListener('click',e=>{
  if(e.target===document.getElementById('lightbox')) closeLightbox();
});
document.addEventListener('keydown',e=>{
  if(!document.getElementById('lightbox').classList.contains('open')) return;
  if(e.key==='Escape') closeLightbox();
  if(e.key==='ArrowLeft') lbNavigate(-1);
  if(e.key==='ArrowRight') lbNavigate(1);
});

/* =============================================
   CONFETTI
============================================= */
function launchConfetti(){
  const colors=['#f472b6','#fba8d0','#fce7f3','#fb7185','#ffffff','#f9a8d4','#fbcfe8'];
  const shapes=['50%','2px'];
  for(let i=0;i<80;i++){
    const el=document.createElement('div');
    el.className='confetti-piece';
    const sz=6+Math.random()*9;
    el.style.cssText=`
      left:${Math.random()*100}vw;
      width:${sz}px; height:${sz}px;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      border-radius:${shapes[Math.random()<.6?0:1]};
      animation-duration:${2.4+Math.random()*2}s;
      animation-delay:${Math.random()*.7}s;
    `;
    document.body.appendChild(el);
    el.addEventListener('animationend',()=>el.remove());
  }
}

/* =============================================
   GACHA BUTTON
============================================= */
const btn     =document.getElementById('gacha-btn');
const capsule =document.getElementById('capsule-svg');
const statusEl=document.getElementById('status-msg');

function setAlreadyUI(){
  btn.disabled=true;
  statusEl.innerHTML='今日の思い出を開いたよ 💕<br><small style="font-size:11px;opacity:0.6">また明日ね 🎀</small>';
}

async function init(){
  await loadPhotos();

  const rec=getToday();
  if(rec&&rec.date===todayStr()&&photoMap[rec.key]!==undefined){
    setAlreadyUI();
    showPhoto(rec.key,false);
  }

  renderCollection();
}

btn.addEventListener('click',()=>{
  if(!Object.keys(photoMap).length){
    statusEl.textContent='まだ写真が登録されていないよ 📷';
    return;
  }

  btn.disabled=true;
  statusEl.textContent='';

  capsule.classList.add('spinning');

  setTimeout(()=>{
    capsule.classList.remove('spinning');
    capsule.classList.add('burst');

    setTimeout(()=>{
      const key=pickRandom();
      if(!key){ capsule.classList.remove('burst'); return; }

      const pulled=getPulled();
      if(!pulled.includes(key)) pulled.push(key);
      setPulled(pulled);
      setToday({date:todayStr(),key});

      capsule.style.visibility='hidden';
      capsule.classList.remove('burst');

      setAlreadyUI();
      showPhoto(key,true);
      launchConfetti();
      renderCollection();
    },450);
  },1500);
});

init();
</script>
